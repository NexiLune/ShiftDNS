[package]
name = "shiftdns"
version = "1.0.0"
edition = "2021"
description = "Ultra-lightweight minimal Windows DNS switcher with system tray quick-toggle"
authors = ["ShiftDNS"]

[[bin]]
name = "ShiftDNS"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
tray-icon = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
