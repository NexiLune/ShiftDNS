<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShiftDNS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font-sans: "Plus Jakarta Sans", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --ease-unslop: cubic-bezier(0.22, 1, 0.36, 1);

    --bg: #141415;
    --chrome-bg: #111112;
    --text: #EDEDED;
    --text-muted: #7A7A80;
    --text-sub: #7A7A80;
    --text-soft: #A1A1A6;
    --text-footer: #7A7A80;
    --border: rgba(255, 255, 255, 0.07);
    --border-outer: #262628;
    --active-bg: #1C1C1E;
    --hover-bg: #19191B;
    --icon-hover-bg: #222225;
    --action-hover-bg: #26262A;
    --accent: #4CC38A;
    --fast: #4CC38A;
    --medium: #A1A1A6;
    --slow: #E5A93B;
    --timeout: #E5484D;
    --input-bg: #1B1B1E;
    --input-focus-bg: #1F1F23;
    --input-border: rgba(255, 255, 255, 0.09);
    --input-focus-border: rgba(255, 255, 255, 0.28);
    --input-placeholder: #636369;
    --btn-sec-bg: #262629;
    --btn-sec-hover: #303034;
    --btn-sec-border: rgba(255, 255, 255, 0.11);
    --btn-sec-hover-border: rgba(255, 255, 255, 0.17);
    --btn-sec-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 1px 2px rgba(0, 0, 0, 0.28);
    --tooltip-bg: #1B1B1E;
    --tooltip-border: rgba(255, 255, 255, 0.1);
    --tooltip-text: #EDEDED;
    --tooltip-shadow: 0 8px 20px rgba(0, 0, 0, 0.48);
    --mono-accent: #EDEDED;
    --mono-accent-hover: #FFFFFF;
    --mono-accent-text: #141415;
    --mono-focus-border: rgba(255, 255, 255, 0.28);
    --seg-bg: #1A1A1C;
    --seg-border: rgba(255, 255, 255, 0.08);
    --seg-active-bg: #323235;
    --seg-active-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --switch-off-bg: #2E2E32;
    --switch-off-thumb: #8E8E93;
    --switch-on-bg: #EDEDED;
    --switch-on-thumb: #141415;
    --title-divider: rgba(255, 255, 255, 0.12);
    --kb-ring: rgba(255, 255, 255, 0.26);
    --scroll-thumb: rgba(255, 255, 255, 0.09);
    --scroll-thumb-hover: rgba(255, 255, 255, 0.22);
    --scroll-thumb-active: rgba(255, 255, 255, 0.36);
    --pill-hover: rgba(255, 255, 255, 0.06);
    --danger-bg: rgba(229, 72, 77, 0.14);
    --danger-border: rgba(229, 72, 77, 0.32);
    --danger-text: #F87171;
    --danger-hover-bg: #E5484D;
  }

  html.light {
    --bg: #FFFFFF;
    --chrome-bg: #FAFAFA;
    --text: #171717;
    --text-muted: #737373;
    --text-sub: #737373;
    --text-soft: #525252;
    --text-footer: #737373;
    --border: rgba(23, 23, 23, 0.08);
    --border-outer: #E4E4E7;
    --active-bg: #F4F4F5;
    --hover-bg: #F7F7F8;
    --icon-hover-bg: #ECECEE;
    --action-hover-bg: #E4E4E7;
    --accent: #16A34A;
    --fast: #16A34A;
    --medium: #525252;
    --slow: #B45309;
    --timeout: #DC2626;
    --input-bg: #F4F4F5;
    --input-focus-bg: #FFFFFF;
    --input-border: rgba(23, 23, 23, 0.1);
    --input-focus-border: rgba(23, 23, 23, 0.35);
    --input-placeholder: #9CA3AF;
    --btn-sec-bg: #FFFFFF;
    --btn-sec-hover: #F4F4F5;
    --btn-sec-border: rgba(23, 23, 23, 0.12);
    --btn-sec-hover-border: rgba(23, 23, 23, 0.18);
    --btn-sec-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    --tooltip-bg: #FFFFFF;
    --tooltip-border: #E4E4E7;
    --tooltip-text: #171717;
    --tooltip-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    --mono-accent: #171717;
    --mono-accent-hover: #2A2A2D;
    --mono-accent-text: #FFFFFF;
    --mono-focus-border: rgba(23, 23, 23, 0.35);
    --seg-bg: #F1F1F3;
    --seg-border: rgba(23, 23, 23, 0.08);
    --seg-active-bg: #FFFFFF;
    --seg-active-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
    --switch-off-bg: #D4D4D8;
    --switch-off-thumb: #FFFFFF;
    --switch-on-bg: #171717;
    --switch-on-thumb: #FFFFFF;
    --title-divider: rgba(23, 23, 23, 0.12);
    --kb-ring: rgba(23, 23, 23, 0.22);
    --scroll-thumb: rgba(23, 23, 23, 0.09);
    --scroll-thumb-hover: rgba(23, 23, 23, 0.22);
    --scroll-thumb-active: rgba(23, 23, 23, 0.34);
    --pill-hover: rgba(23, 23, 23, 0.06);
    --danger-bg: rgba(220, 38, 38, 0.09);
    --danger-border: rgba(220, 38, 38, 0.25);
    --danger-text: #DC2626;
    --danger-hover-bg: #DC2626;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app-shell {
    width: 100%;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-outer);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transform-origin: center center;
    will-change: opacity, transform;
    transition:
      opacity 130ms cubic-bezier(0.2, 0, 0, 1),
      transform 130ms cubic-bezier(0.2, 0, 0, 1),
      background-color 150ms var(--ease-unslop),
      color 150ms var(--ease-unslop),
      border-color 150ms var(--ease-unslop);
  }

  #main-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .app-shell.win-hidden {
    opacity: 0;
    transform: scale(0.98);
    pointer-events: none;
  }

  .app-shell.win-no-transition {
    transition: none !important;
  }

  html.suspend-hover .icon-btn:hover {
    color: var(--text-muted);
    background: transparent;
  }
  html.suspend-hover .dns-row:not(.active):hover { background: transparent; }
  html.suspend-hover .dns-row:hover .grip-icon { opacity: 0; }
  html.suspend-hover .dns-row:not(.confirming-delete):hover .row-actions { opacity: 0; pointer-events: none; }
  html.suspend-hover .dns-row:not(.confirming-delete):hover .row-status { opacity: 1; pointer-events: auto; }
  html.suspend-hover .settings-toggle-row:hover { background: transparent; }
  html.suspend-hover .settings-action-btn:hover,
  html.suspend-hover .empty-restore-btn:hover { background: var(--btn-sec-bg); border-color: var(--btn-sec-border); }
  html.suspend-hover .adapter-pill:hover { background: transparent; }
  html.suspend-hover .adapter-pill:hover .adapter-text { color: var(--text-soft); }
  html.suspend-hover .tooltip { opacity: 0 !important; }

  /* Titlebar */
  .titlebar {
    height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .title-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .icon-btn.back-icon { margin-left: -6px; }

  .drag-spacer {
    flex: 1;
    height: 100%;
    min-width: 20px;
  }

  .title-controls {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .title-divider {
    width: 1px;
    height: 14px;
    margin: 0 5px;
    background: var(--title-divider);
    flex-shrink: 0;
  }

  .icon-btn-wrap {
    position: relative;
    display: inline-flex;
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 150ms var(--ease-unslop), background-color 150ms var(--ease-unslop);
  }

  .icon-btn:hover {
    color: var(--text);
    background: var(--icon-hover-bg);
  }

  .icon-btn:active { transform: scale(0.95); }
  .icon-btn:focus-visible { outline: 1px solid var(--kb-ring); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* Tooltip: initial={{ opacity: 0, y: 3, scale: 0.96 }} -> animate={{ opacity: 1, y: 0, scale: 1 }}, 120ms cubic-bezier(0.22, 1, 0.36, 1) */
  .tooltip {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(3px) scale(0.96);
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--tooltip-bg);
    border: 1px solid var(--tooltip-border);
    color: var(--tooltip-text);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: var(--tooltip-shadow);
    pointer-events: none;
    opacity: 0;
    z-index: 40;
    transition: opacity 120ms var(--ease-unslop), transform 120ms var(--ease-unslop);
  }

  .tooltip.right {
    left: auto;
    right: 0;
    transform: translateY(3px) scale(0.96);
  }

  .tooltip.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  .tooltip.right.show {
    transform: translateY(0) scale(1);
  }

  /* View panel transitions: initial={{ opacity: 0, y: 4 }}, animate={{ opacity: 1, y: 0 }}, exit={{ opacity: 0, y: -4 }}, duration: 0.15 */
  .view-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 150ms ease, transform 150ms ease;
  }

  .view-panel.view-pre-enter {
    opacity: 0;
    transform: translateY(4px);
  }

  .view-panel.view-exiting {
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
  }

  /* Checkmark transitions: initial={{ opacity: 0, scale: 0.8 }}, animate={{ opacity: 1, scale: 1 }}, duration: 0.15 */
  .check-badge {
    display: inline-flex;
    flex-shrink: 0;
    transition: opacity 150ms ease, transform 150ms ease;
  }

  .check-badge.check-pre-enter {
    opacity: 0;
    transform: scale(0.8);
  }

  /* Smooth Scroll Containers (204px body = DHCP + 3 DNS rows, scrolls smoothly from 4th row) */
  .dns-list,
  .settings-scroll,
  .form-scroll {
    flex: 1;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    padding-bottom: 0;
  }

  .settings-scroll {
    padding-bottom: 6px;
  }

  .scroll-fade.fade-bottom {
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 28px), transparent 100%);
  }

  .scroll-fade.fade-top {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 100%);
  }

  .scroll-fade.fade-top.fade-bottom {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 calc(100% - 28px), transparent 100%);
  }

  @supports (-moz-appearance: none) {
    .dns-list,
    .settings-scroll,
    .form-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
    }
    html.light .dns-list,
    html.light .settings-scroll,
    html.light .form-scroll {
      scrollbar-color: rgba(23, 23, 23, 0.14) transparent;
    }
  }

  .dns-list::-webkit-scrollbar,
  .settings-scroll::-webkit-scrollbar,
  .form-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .dns-list::-webkit-scrollbar-track,
  .settings-scroll::-webkit-scrollbar-track,
  .form-scroll::-webkit-scrollbar-track { background: transparent; }
  .dns-list::-webkit-scrollbar-button,
  .settings-scroll::-webkit-scrollbar-button,
  .form-scroll::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  .dns-list::-webkit-scrollbar-thumb,
  .settings-scroll::-webkit-scrollbar-thumb,
  .form-scroll::-webkit-scrollbar-thumb {
    background-color: var(--scroll-thumb);
    border-radius: 9999px;
  }
  .dns-list:hover::-webkit-scrollbar-thumb,
  .settings-scroll:hover::-webkit-scrollbar-thumb,
  .form-scroll:hover::-webkit-scrollbar-thumb { background-color: var(--scroll-thumb-hover); }
  .dns-list::-webkit-scrollbar-thumb:hover,
  .settings-scroll::-webkit-scrollbar-thumb:hover,
  .form-scroll::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-active); }

  .dns-row {
    position: relative;
    width: 100%;
    height: 51px;
    min-height: 51px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: transparent;
    transition: background-color 150ms ease;
  }

  .dns-row.last-row {
    border-bottom: 0;
    height: 50px;
    min-height: 50px;
  }
  .dns-row.active { background: var(--active-bg); }
  .dns-row:not(.active):hover { background: var(--hover-bg); }
  .dns-row.kb-focused {
    box-shadow: inset 0 0 0 1px var(--kb-ring);
    background: var(--hover-bg);
  }
  .dns-row.dragging {
    position: relative;
    background: var(--active-bg);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    z-index: 25;
    transition: none;
    will-change: transform;
    pointer-events: none;
  }

  html.light .dns-row.dragging {
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  }

  .dns-row.drag-neighbor {
    transition: transform 200ms cubic-bezier(0.2, 0, 0, 1);
    will-change: transform;
  }

  .dns-list.is-dragging .dns-row:not(.dragging):hover {
    background: transparent;
  }
  .dns-list.is-dragging .dns-row:not(.dragging):hover .row-actions {
    opacity: 0;
    pointer-events: none;
  }
  .dns-list.is-dragging .dns-row:not(.dragging):hover .row-status {
    opacity: 1;
  }
  .dns-list.is-dragging .dns-row:not(.dragging):hover .grip-icon {
    opacity: 0;
  }

  .active-bar {
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 2.5px;
    border-radius: 0 9999px 9999px 0;
    background: var(--accent);
    pointer-events: none;
    z-index: 20;
  }

  .dhcp-btn {
    width: 100%;
    height: 100%;
    padding: 7px 16px 7px 20px;
    border: 0;
    background: transparent;
    color: inherit;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    cursor: pointer;
  }

  .row-main-btn {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 7px 8px 7px 20px;
    border: 0;
    background: transparent;
    color: inherit;
    font-family: inherit;
    display: flex;
    align-items: center;
    text-align: left;
    cursor: grab;
    touch-action: none;
  }

  .row-main-btn:active { cursor: grabbing; }
  .row-main-btn:focus, .dhcp-btn:focus { outline: none; }

  .grip-icon {
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 12px;
    color: var(--text-muted);
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease;
  }

  @media (hover: hover) {
    .dns-row:hover .grip-icon { opacity: 0.55; }
  }

  .row-info { min-width: 0; flex: 1; }

  .row-title-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .row-name {
    font-size: 13px;
    line-height: 18px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-ips,
  .row-sub {
    font-size: 12px;
    line-height: 16px;
    margin-top: 1px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-ips {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .row-right {
    position: relative;
    padding-right: 16px;
    display: inline-grid;
    align-items: center;
    justify-items: end;
    flex-shrink: 0;
  }

  .row-actions, .row-status {
    grid-column: 1;
    grid-row: 1;
    justify-self: end;
    display: flex;
    align-items: center;
  }

  .row-actions {
    gap: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease;
  }

  .row-status {
    gap: 6px;
    opacity: 1;
    pointer-events: auto;
    transition: opacity 150ms ease;
  }

  @media (hover: hover) {
    .dns-row:not(.just-activated):hover .row-actions {
      opacity: 1;
      pointer-events: auto;
    }
    .dns-row:not(.just-activated):hover .row-status {
      opacity: 0;
      pointer-events: none;
    }
  }

  .dns-row:has(.row-actions:focus-within) .row-actions,
  .dns-row.confirming-delete .row-actions {
    opacity: 1;
    pointer-events: auto;
  }

  .dns-row:has(.row-actions:focus-within) .row-status,
  .dns-row.confirming-delete .row-status {
    opacity: 0;
    pointer-events: none;
  }

  .action-btn {
    padding: 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 150ms ease, background-color 150ms ease;
  }

  .action-btn:hover {
    color: var(--text);
    background: var(--action-hover-bg);
  }

  .action-btn.delete:hover {
    color: var(--timeout);
  }

  .action-btn:focus-visible { outline: 1px solid var(--kb-ring); }
  .action-btn svg { width: 14px; height: 14px; }

  .confirm-delete-btn {
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--danger-border);
    border-radius: 6px;
    background: var(--danger-bg);
    color: var(--danger-text);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 140ms var(--ease-unslop), border-color 140ms var(--ease-unslop), color 140ms var(--ease-unslop), transform 140ms var(--ease-unslop);
  }

  .confirm-delete-btn:hover {
    background: var(--danger-hover-bg);
    border-color: var(--danger-hover-bg);
    color: #FFFFFF;
  }

  .confirm-delete-btn:active { transform: scale(0.97); }
  .confirm-delete-btn:focus-visible { outline: 1px solid var(--danger-hover-bg); outline-offset: 1px; }

  .ping-btn {
    padding: 2px 6px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background-color 150ms ease;
  }

  .ping-btn:hover { background: var(--pill-hover); }
  .ping-fast { color: var(--fast); }
  .ping-medium { color: var(--medium); }
  .ping-slow { color: var(--slow); }
  .ping-timeout { color: var(--timeout); }
  .ping-none { color: var(--text-muted); }

  .check-icon {
    width: 16px;
    height: 16px;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* Empty State */
  .empty-state {
    padding: 32px 16px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  .empty-state p { margin-bottom: 12px; }

  .empty-restore-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--btn-sec-border);
    border-radius: 7px;
    background: var(--btn-sec-bg);
    color: var(--text);
    box-shadow: var(--btn-sec-shadow);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 140ms var(--ease-unslop), border-color 140ms var(--ease-unslop), transform 140ms var(--ease-unslop);
  }
  .empty-restore-btn:hover { background: var(--btn-sec-hover); border-color: var(--btn-sec-hover-border); }
  .empty-restore-btn:active { transform: scale(0.97); }
  .empty-restore-btn:focus-visible { outline: 2px solid var(--kb-ring); outline-offset: 2px; }
  .empty-restore-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* Settings View */

  .settings-action-btn {

  .settings-action-btn:hover:not(:disabled) {

    font-size: 13px;
    font-weight: 600;

  /* Status Footer */
  .status-bar {
    height: 36px;
    padding: 0 16px;

  .adapter-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    max-width: 55%;
    flex-shrink: 1;

    margin-left: -6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    text-align: left;

  }

  .adapter-pill:focus-visible {

    width: 6px;

  }

  .status-msg-wrap {
    min-width: 0;
    overflow: hidden;
    text-align: right;
  }

  /* Footer status message: initial={{ opacity: 0, y: 3 }}, animate={{ opacity: 1, y: 0 }}, exit={{ opacity: 0, y: -3 }}, 150ms cubic-bezier(0.22, 1, 0.36, 1) */
  .status-msg {
    color: var(--text-footer);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 150ms var(--ease-unslop), transform 150ms var(--ease-unslop);
  }

  .status-msg.status-pre-enter {
    opacity: 0;
    transform: translateY(3px);
  }

  .status-msg.status-exiting {
    opacity: 0;
    transform: translateY(-3px);
  }

  .status-msg.error { color: var(--timeout); }
</style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <!-- Unified Title Bar -->
  <header class="titlebar" id="titlebar">
    <div class="title-left" id="title-left"></div>
    <div class="drag-spacer" id="drag-spacer"></div>
    <div class="title-controls" id="title-controls"></div>
  </header>

  <!-- Main Content Body -->
  <main id="main-body"></main>

  <!-- Footer Adapter & Status Bar -->
  <footer class="status-bar" aria-live="polite">
    <button
      type="button"
      class="adapter-pill"
      id="btn-adapter"
      title="Click to switch network adapter (Auto ↔ available adapters)"
      aria-label="Switch network adapter"
    >
      <span class="adapter-dot" aria-hidden="true"></span>
      <span class="adapter-text" id="adapter-label">Auto (Wi-Fi) · Admin</span>
    </button>
    <div class="status-msg-wrap">
      <div class="status-msg" id="status-message">System Default (DHCP)</div>
    </div>
  </footer>
</div>

<script>
(() => {
  const ICONS = {
    settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`,
    minus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>`,
    x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
    chevronLeft: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>`,
    plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`,
    check: `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`,
    rotateCcw: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
    pencil: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>`,
    trash2: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>`,
    grip: `<svg class="grip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>`,
    download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`
  };

  const DHCP_ID = '__dhcp__';

  const appState = {
    appVersion: '',
    profiles: [],
    activeProfileId: null,
    themeMode: 'system', // 'system' | 'dark' | 'light'
    darkMode: true,
    soundEffects: true,
    enableIpv6: true,
    enableDoh: false,
    startMinimized: false,
    launchAtStartup: false,
    resolveCheckDomain: 'cloudflare.com',
    adapterLabel: 'Auto (Wi-Fi) · Admin',
    activeLatency: undefined, // undefined = not probed, null = timeout, number = ms
    activeResolveStatus: null, // 'ok' | 'blocked' | 'no_answer' | 'timeout' | null
    activeResolvedIp: null,
    probingActive: false,
    updateState: { status: 'idle', latestVersion: null, downloadUrl: null, message: null },
    statusMessage: 'System Default (DHCP)',
    statusIsError: false,
  };

  const SOUND_RECIPES = {
    activate: [
      { type: 'sine', f0: 494, f1: 523.25, delay: 0, dur: 0.065, gain: 0.06 },
      { type: 'sine', f0: 783.99, delay: 0.048, dur: 0.135, gain: 0.055 },
      { type: 'sine', f0: 1567.98, delay: 0.048, dur: 0.075, gain: 0.015 },
    ],
    dhcp: [
      { type: 'sine', f0: 587.33, f1: 523.25, delay: 0, dur: 0.065, gain: 0.055 },
      { type: 'sine', f0: 440, f1: 392, delay: 0.048, dur: 0.125, gain: 0.05 },
    ],
    toggleOn: [{ type: 'triangle', f0: 620, f1: 880, delay: 0, dur: 0.042, gain: 0.055 }],
    toggleOff: [{ type: 'triangle', f0: 560, f1: 390, delay: 0, dur: 0.042, gain: 0.045 }],
    click: [{ type: 'sine', f0: 920, f1: 510, delay: 0, dur: 0.026, gain: 0.04 }],
    save: [
      { type: 'sine', f0: 523.25, delay: 0, dur: 0.075, gain: 0.045 },
      { type: 'sine', f0: 659.25, delay: 0.042, dur: 0.085, gain: 0.048 },
      { type: 'sine', f0: 783.99, delay: 0.084, dur: 0.135, gain: 0.055 },
    ],
    delete: [{ type: 'triangle', f0: 320, f1: 175, delay: 0, dur: 0.075, gain: 0.055 }],
    error: [
      { type: 'triangle', f0: 230, f1: 195, delay: 0, dur: 0.05, gain: 0.05 },
      { type: 'triangle', f0: 205, f1: 170, delay: 0.068, dur: 0.06, gain: 0.045 },
    ],
  };

  let audioCtx = null;
  function playSound(cue, forceEnabled) {
    if (!(forceEnabled === undefined ? appState.soundEffects : forceEnabled)) return;
    const steps = SOUND_RECIPES[cue];
    if (!steps) return;
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      if (!audioCtx) audioCtx = new Ctor();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3800, audioCtx.currentTime);
      filter.connect(audioCtx.destination);
      const base = audioCtx.currentTime + 0.002;
      for (const s of steps) {
        const start = base + s.delay;
        const end = start + s.dur;
        const atk = Math.min(0.004, s.dur * 0.25);
        const osc = audioCtx.createOscillator();
        osc.type = s.type;
        osc.frequency.setValueAtTime(s.f0, start);
        if (s.f1 && s.f1 !== s.f0) osc.frequency.exponentialRampToValueAtTime(s.f1, end);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(s.gain, start + atk);
        gain.gain.exponentialRampToValueAtTime(0.0001, end);
        osc.connect(gain);
        gain.connect(filter);
        osc.start(start);
        osc.stop(end + 0.008);
      }
    } catch {}
  }

  let viewMode = 'servers'; // 'servers' | 'settings' | 'add-dns'
  let formReturnView = 'servers';
  let editingProfile = null;
  let showAdvanced = false;
  let formError = null;
  let focusedNavId = null;
  let draggingState = null;
  let suppressDragClickUntil = 0;
  let pendingSyncPayload = null;

  function postIpc(msg) {
    if (window.ipc && typeof window.ipc.postMessage === 'function') {
      window.ipc.postMessage(JSON.stringify(msg));
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function latencyInfo(ms, probing, resolveStatus, resolvedIp, domain) {
    const host = domain || 'cloudflare.com';
    if (probing || ms === undefined) {
      return { text: '...', cls: 'ping-none', title: `Testing ${host} (port 53)...` };
    }
    if (ms === null || resolveStatus === 'timeout') {
      return {
        text: 'Timeout',
        cls: 'ping-timeout',
        title: `Timeout resolving ${host} · Click to retest`,
      };
    }
    if (resolveStatus === 'blocked') {
      return {
        text: 'Blocked',
        cls: 'ping-timeout',
        title: `Blocked: ${host} → ${resolvedIp || '0.0.0.0'} · Click to retest`,
      };
    }
    if (resolveStatus === 'no_answer') {
      return {
        text: 'No IP',
        cls: 'ping-slow',
        title: `No A record for ${host} · Click to retest`,
      };
    }
    const cls = ms <= 18 ? 'ping-fast' : ms <= 27 ? 'ping-medium' : 'ping-slow';
    const title = resolvedIp
      ? `${host} → ${resolvedIp} · Click to retest`
      : `Click to retest ${host} (port 53)`;
    return { text: `${ms} ms`, cls, title };
  }

  const systemThemeQuery =
    typeof window.matchMedia === 'function'
      ? window.matchMedia('(prefers-color-scheme: dark)')
      : null;

  function resolveThemeDark(mode) {
    if (mode === 'dark') return true;
    if (mode === 'light') return false;
    return systemThemeQuery ? systemThemeQuery.matches : true;
  }

  function applyTheme() {
    document.documentElement.classList.toggle('light', !appState.darkMode);
  }

  if (systemThemeQuery && typeof systemThemeQuery.addEventListener === 'function') {
    systemThemeQuery.addEventListener('change', (ev) => {
      if (appState.themeMode === 'system' && !(window.ipc && typeof window.ipc.postMessage === 'function')) {
        appState.darkMode = ev.matches;
        applyTheme();
      }
    });
  }

  const activeTooltipHiders = new Set();

  function clearHoverAndTooltipState() {
    activeTooltipHiders.forEach((hide) => hide());
    document.querySelectorAll('.tooltip.show').forEach((el) => el.classList.remove('show'));
    document.documentElement.classList.add('suspend-hover');
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
  }

  document.addEventListener(
    'pointermove',
    () => {
      document.documentElement.classList.remove('suspend-hover');
    },
    { passive: true }
  );

  window.addEventListener('blur', clearHoverAndTooltipState);

  let pendingHideCleanup = null;

  function cancelPendingHide() {
    if (pendingHideCleanup) {
      pendingHideCleanup();
      pendingHideCleanup = null;
    }
  }

  function animateHideAndPost(target = 'tray') {
    const isTaskbar = target === 'taskbar';
    const beginType = isTaskbar ? 'beginMinimize' : 'beginHide';
    const finishType = isTaskbar ? 'minimizeWindow' : 'hideWindow';
    const shell = document.getElementById('app-shell');
    clearHoverAndTooltipState();
    postIpc({ type: beginType });

    if (!shell) {
      postIpc({ type: finishType });
      return;
    }

    if (shell.classList.contains('win-hidden')) {
      cancelPendingHide();
      postIpc({ type: finishType });
      return;
    }

    if (pendingHideCleanup) return;

    let done = false;
    let fallbackTimer = null;

    const cleanup = () => {
      shell.removeEventListener('transitionend', onEnd);
      if (fallbackTimer !== null) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
      pendingHideCleanup = null;
    };

    const complete = () => {
      if (done) return;
      done = true;
      cleanup();
      postIpc({ type: finishType });
    };

    const onEnd = (ev) => {
      if (ev.target === shell && (ev.propertyName === 'opacity' || ev.propertyName === 'transform')) {
        complete();
      }
    };

    pendingHideCleanup = () => {
      done = true;
      cleanup();
    };

    shell.classList.remove('win-no-transition');
    void shell.offsetWidth;
    shell.addEventListener('transitionend', onEnd);
    fallbackTimer = setTimeout(complete, 175);
    shell.classList.add('win-hidden');
  }

  window.__shiftdnsPrepareShow = function () {
    cancelPendingHide();
    clearHoverAndTooltipState();
    const shell = document.getElementById('app-shell');
    if (!shell) return;
    shell.classList.add('win-no-transition', 'win-hidden');
    void shell.offsetWidth;
  };

  window.__shiftdnsAnimateShow = function () {
    clearHoverAndTooltipState();
    const shell = document.getElementById('app-shell');
    if (!shell) return;
    shell.classList.add('win-no-transition', 'win-hidden');
    void shell.offsetWidth;
    requestAnimationFrame(() => {
      shell.classList.remove('win-no-transition');
      void shell.offsetWidth;
      shell.classList.remove('win-hidden');
    });
  };

  window.__shiftdnsAnimateHide = function () {
    animateHideAndPost();
  };

  function attachTooltipBehavior(btnWrap, tooltipEl) {
    let timer = null;
    const btn = btnWrap.querySelector('button');
    const show = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        if (!document.documentElement.classList.contains('suspend-hover')) {
          tooltipEl.classList.add('show');
        }
      }, 150);
    };
    const hide = () => {
      if (timer) { clearTimeout(timer); timer = null; }
      tooltipEl.classList.remove('show');
    };
    activeTooltipHiders.add(hide);
    btnWrap.addEventListener('mouseenter', show);
    btnWrap.addEventListener('mouseleave', hide);
    btn.addEventListener('focus', show);
    btn.addEventListener('blur', hide);
  }

  let lastHeaderKey = null;

  function renderHeader() {
    const headerKey = `${viewMode}:${editingProfile ? editingProfile.id || 'edit' : ''}`;
    if (headerKey === lastHeaderKey) return;
    lastHeaderKey = headerKey;

    const left = document.getElementById('title-left');
    const controls = document.getElementById('title-controls');
    activeTooltipHiders.clear();

    if (viewMode === 'settings') {
      left.innerHTML = `<button type="button" class="icon-btn back-icon" id="btn-back" aria-label="Back to DNS servers">${ICONS.chevronLeft}</button><span class="brand">Settings</span>`;
      document.getElementById('btn-back').onclick = () => {
        playSound('click');
        transitionView('servers');
      };
    } else if (viewMode === 'add-dns') {
      const label = editingProfile ? 'Edit DNS' : 'Add DNS';
      left.innerHTML = `<button type="button" class="icon-btn back-icon" id="btn-back" aria-label="Back to DNS servers">${ICONS.chevronLeft}</button><span class="brand">${label}</span>`;
      document.getElementById('btn-back').onclick = () => {
        playSound('click');
        const target = formReturnView;
        transitionView(target, () => {
          editingProfile = null;
          formError = null;
        });
      };
    } else {
      left.innerHTML = `<div class="brand">ShiftDNS</div>`;
    }

    controls.innerHTML = '';
    const addControl = (id, label, tooltip, iconHtml, alignRight, onClick) => {
      const wrap = document.createElement('div');
      wrap.className = 'icon-btn-wrap';
      wrap.innerHTML = `<button type="button" class="icon-btn" id="${id}" aria-label="${escHtml(label)}">${iconHtml}</button><div role="tooltip" class="tooltip ${alignRight ? 'right' : ''}">${escHtml(tooltip)}</div>`;
      wrap.querySelector('button').onclick = onClick;
      attachTooltipBehavior(wrap, wrap.querySelector('.tooltip'));
      controls.appendChild(wrap);
    };

    if (viewMode === 'servers') {
      addControl('btn-add', 'Add custom DNS', 'Add DNS (Ctrl+N)', ICONS.plus, false, () => {
        playSound('click');
        openAddForm('servers');
      });
      addControl('btn-settings', 'Settings', 'Settings', ICONS.settings, false, () => {
        playSound('click');
        transitionView('settings');
      });
      const divider = document.createElement('span');
      divider.className = 'title-divider';
      divider.setAttribute('aria-hidden', 'true');
      controls.appendChild(divider);
    }
    addControl('btn-close', 'Close ShiftDNS to system tray', 'Close to tray (Esc)', ICONS.x, true, () => {
      playSound('click');
      animateHideAndPost('tray');
    });
  }

  let lastStatusMessage = null;
  let statusAnimTimer = null;

  function renderFooter() {
    document.getElementById('adapter-label').textContent = appState.adapterLabel;
    const statusEl = document.getElementById('status-message');
    const nextMsg = appState.statusMessage;
    const baseCls = 'status-msg' + (appState.statusIsError ? ' error' : '');

    if (lastStatusMessage === null) {
      lastStatusMessage = nextMsg;
      statusEl.textContent = nextMsg;
      statusEl.className = baseCls;
      return;
    }

    if (nextMsg !== lastStatusMessage) {
      lastStatusMessage = nextMsg;
      if (statusAnimTimer) clearTimeout(statusAnimTimer);
      statusEl.className = `${baseCls} status-exiting`;
      statusAnimTimer = setTimeout(() => {
        statusAnimTimer = null;
        statusEl.textContent = appState.statusMessage;
        const enteredCls = 'status-msg' + (appState.statusIsError ? ' error' : '');
        statusEl.className = `${enteredCls} status-pre-enter`;
        void statusEl.offsetWidth;
        requestAnimationFrame(() => {
          statusEl.className = enteredCls;
        });
      }, 150);
    } else if (!statusAnimTimer) {
      statusEl.className = baseCls;
    }
  }

  let viewTransitionTimer = null;
  let lastActiveProfileId = null;

  function transitionView(nextView, beforeEnter) {
    if (viewTransitionTimer) {
      clearTimeout(viewTransitionTimer);
      viewTransitionTimer = null;
    }
    const main = document.getElementById('main-body');
    const currentChild = main && main.firstElementChild;
    if (currentChild) {
      currentChild.classList.add('view-exiting');
      viewTransitionTimer = setTimeout(() => {
        viewTransitionTimer = null;
        if (beforeEnter) beforeEnter();
        viewMode = nextView;
        renderAll(true);
      }, 150);
    } else {
      if (beforeEnter) beforeEnter();
      viewMode = nextView;
      renderAll(true);
    }
  }

  function renderBody(animateView) {
    const main = document.getElementById('main-body');
    const prevList = document.getElementById('dns-list');
    const prevScroll = prevList ? prevList.scrollTop : 0;

    // Capture active indicator position so the green bar glides smoothly to the newly selected row
    let prevBarTop = null;
    if (prevList && viewMode === 'servers') {
      const prevBar = prevList.querySelector('.active-bar');
      if (prevBar) prevBarTop = prevBar.getBoundingClientRect().top;
    }

    if (viewMode === 'settings') {
      renderSettingsView(main, animateView);
    } else if (viewMode === 'add-dns') {
      renderFormView(main, animateView);
    } else {
      renderServersView(main, animateView, prevScroll, prevBarTop);
    }
  }

  function mountViewPanel(main, wrap, animateView) {
    wrap.className = animateView ? 'view-panel view-pre-enter' : 'view-panel';
    main.replaceChildren(wrap);
    if (animateView) {
      void wrap.offsetWidth;
      requestAnimationFrame(() => {
        wrap.classList.remove('view-pre-enter');
      });
    }
  }

  function updateScrollFade(el) {
    if (!el) return;
    const maxScroll = el.scrollHeight - el.clientHeight;
    const hasOverflow = maxScroll > 2;
    const showTop = hasOverflow && el.scrollTop > 2;
    const showBottom = hasOverflow && el.scrollTop < maxScroll - 2;
    el.classList.toggle('fade-top', showTop);
    el.classList.toggle('fade-bottom', showBottom);
  }

  let justActivatedId = null;
  let justActivatedTimer = null;
  let confirmingDeleteId = null;
  let confirmingDeleteTimer = null;

  function bindRowActionHandlers(row, p, isConfirming) {
    if (isConfirming) {
      const confirmBtn = row.querySelector('.confirm-delete-btn');
      const cancelBtn = row.querySelector('.action-btn.cancel-delete');
      if (confirmBtn) {
        confirmBtn.onclick = (ev) => {
          ev.stopPropagation();
          clearConfirmDelete(false);
          playSound('delete');
          postIpc({ type: 'deleteProfile', id: p.id });
        };
      }
      if (cancelBtn) {
        cancelBtn.onclick = (ev) => {
          ev.stopPropagation();
          playSound('click');
          clearConfirmDelete(true);
        };
      }
    } else {
      const editBtn = row.querySelector('.action-btn.edit');
      const deleteBtn = row.querySelector('.action-btn.delete');
      if (editBtn) {
        editBtn.onclick = (ev) => {
          ev.stopPropagation();
          clearConfirmDelete(false);
          playSound('click');
          openEditForm(p);
        };
      }
      if (deleteBtn) {
        deleteBtn.onclick = (ev) => {
          ev.stopPropagation();
          playSound('click');
          armConfirmDelete(p.id);
        };
      }
    }
  }

  function renderRowActionsHtml(p, isConfirming) {
    if (isConfirming) {
      return `
        <button type="button" class="confirm-delete-btn" aria-label="Confirm delete ${escHtml(p.name)}">Delete</button>
        <button type="button" class="action-btn cancel-delete" aria-label="Cancel delete">${ICONS.x}</button>
      `;
    }
    return `
      <button type="button" class="action-btn edit" aria-label="Edit ${escHtml(p.name)}">${ICONS.pencil}</button>
      <button type="button" class="action-btn delete" aria-label="Delete ${escHtml(p.name)}">${ICONS.trash2}</button>
    `;
  }

  function patchRowConfirmUi(profileId, isConfirming) {
    const row = document.querySelector(`.dns-row[data-profile-id="${CSS.escape(profileId)}"]`);
    if (!row) return;
    const profile = appState.profiles.find((p) => p.id === profileId);
    row.classList.toggle('confirming-delete', isConfirming);
    const actionsEl = row.querySelector('.row-actions');
    if (actionsEl && profile) {
      actionsEl.innerHTML = renderRowActionsHtml(profile, isConfirming);
      bindRowActionHandlers(row, profile, isConfirming);
    }
  }

  function clearConfirmDelete(updateDom = false) {
    if (confirmingDeleteTimer !== null) {
      clearTimeout(confirmingDeleteTimer);
      confirmingDeleteTimer = null;
    }
    if (confirmingDeleteId !== null) {
      const prevId = confirmingDeleteId;
      confirmingDeleteId = null;
      if (updateDom && viewMode === 'servers') {
        patchRowConfirmUi(prevId, false);
      }
    }
  }

  function armConfirmDelete(profileId) {
    if (confirmingDeleteId !== null && confirmingDeleteId !== profileId) {
      clearConfirmDelete(true);
    } else if (confirmingDeleteTimer !== null) {
      clearTimeout(confirmingDeleteTimer);
      confirmingDeleteTimer = null;
    }
    confirmingDeleteId = profileId;
    patchRowConfirmUi(profileId, true);
    confirmingDeleteTimer = setTimeout(() => {
      confirmingDeleteTimer = null;
      if (confirmingDeleteId === profileId) {
        confirmingDeleteId = null;
        if (viewMode === 'servers') patchRowConfirmUi(profileId, false);
      }
    }, 3500);
  }

  function clearJustActivated() {
    if (justActivatedTimer !== null) {
      clearTimeout(justActivatedTimer);
      justActivatedTimer = null;
    }
    if (justActivatedId) {
      const prevRow = document.querySelector(`.dns-row[data-profile-id="${CSS.escape(justActivatedId)}"]`);
      if (prevRow) prevRow.classList.remove('just-activated');
      justActivatedId = null;
    }
  }

  function holdActivePing(profileId, ms) {
    if (justActivatedTimer !== null) {
      clearTimeout(justActivatedTimer);
      justActivatedTimer = null;
    }
    if (!profileId) {
      clearJustActivated();
      return;
    }
    justActivatedId = profileId;
    justActivatedTimer = setTimeout(() => {
      clearJustActivated();
    }, ms);
  }

  function applyOptimisticActivation(targetId) {
    clearConfirmDelete(false);
    const selected = targetId ? appState.profiles.find((p) => p.id === targetId) || null : null;
    if (targetId) {
      holdActivePing(targetId, 3200);
    } else {
      clearJustActivated();
    }
    appState.activeProfileId = targetId;
    appState.activeLatency = undefined;
    appState.activeResolveStatus = null;
    appState.activeResolvedIp = null;
    appState.probingActive = Boolean(targetId);
    appState.statusIsError = false;
    appState.statusMessage = selected
      ? `Active: ${selected.name} (${selected.primary_v4})`
      : 'System Default (DHCP)';
    renderAll(false);
    postIpc({ type: 'activateProfile', id: targetId });
  }

  function updateActivePingInPlace() {
    const activeId = appState.activeProfileId;
    if (!activeId) return false;
    const pingBtn = document.querySelector(`.dns-row[data-profile-id="${CSS.escape(activeId)}"] .ping-btn`);
    if (!pingBtn) return false;
    const lat = latencyInfo(
      appState.activeLatency,
      appState.probingActive,
      appState.activeResolveStatus,
      appState.activeResolvedIp,
      appState.resolveCheckDomain
    );
    pingBtn.className = `ping-btn ${lat.cls}`;
    pingBtn.textContent = lat.text;
    pingBtn.title = lat.title;
    pingBtn.setAttribute('aria-label', lat.title);
    if (!appState.probingActive && justActivatedId === activeId) {
      holdActivePing(activeId, 2400);
    }
    return true;
  }

  let activeScrollObserver = null;
  function attachScrollFade(el) {
    if (activeScrollObserver) {
      activeScrollObserver.disconnect();
      activeScrollObserver = null;
    }
    if (!el) return;
    const sync = () => updateScrollFade(el);
    el.addEventListener('scroll', sync, { passive: true });
    if (typeof ResizeObserver === 'function') {
      activeScrollObserver = new ResizeObserver(sync);
      activeScrollObserver.observe(el);
      if (el.firstElementChild) {
        activeScrollObserver.observe(el.firstElementChild);
      }
    }
    sync();
    requestAnimationFrame(sync);
    setTimeout(sync, 170);
  }

  function renderServersView(main, animateView, prevScroll, prevBarTop) {
    const visible = appState.profiles;
    const activeChanged = appState.activeProfileId !== lastActiveProfileId;
    lastActiveProfileId = appState.activeProfileId;

    const wrap = document.createElement('div');

    const list = document.createElement('div');
    list.className = 'dns-list scroll-fade';
    list.id = 'dns-list';

    // System Default (DHCP) Row
    const dhcpRow = document.createElement('div');
    const dhcpActive = appState.activeProfileId === null;
    dhcpRow.className = `dns-row ${dhcpActive ? 'active' : ''} ${focusedNavId === DHCP_ID ? 'kb-focused' : ''}`;
    dhcpRow.dataset.navId = DHCP_ID;
    dhcpRow.innerHTML = `
      ${dhcpActive ? '<span class="active-bar" aria-hidden="true"></span>' : ''}
      <button type="button" class="dhcp-btn" aria-pressed="${dhcpActive}">
        <div class="row-info">
          <div class="row-name">System Default (DHCP)</div>
          <div class="row-sub">Automatic ISP DNS</div>
        </div>
        ${dhcpActive ? `<span class="check-badge ${activeChanged ? 'check-pre-enter' : ''}">${ICONS.check}</span>` : ''}
      </button>
    `;
    dhcpRow.querySelector('button').onclick = () => {
      focusedNavId = null;
      playSound('dhcp');
      applyOptimisticActivation(null);
    };
    list.appendChild(dhcpRow);

    if (visible.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<p>No DNS servers in list</p><button type="button" class="empty-restore-btn" id="btn-empty-restore">${ICONS.rotateCcw}<span>Restore defaults</span></button>`;
      empty.querySelector('#btn-empty-restore').onclick = () => {
        playSound('save');
        postIpc({ type: 'resetDefaults' });
      };
      list.appendChild(empty);
    } else {
      visible.forEach((p, idx) => {
        const isActive = appState.activeProfileId === p.id;
        const isLast = idx === visible.length - 1;
        const ips = p.secondary_v4 ? `${p.primary_v4} · ${p.secondary_v4}` : p.primary_v4;
        const lat = isActive
          ? latencyInfo(
              appState.activeLatency,
              appState.probingActive,
              appState.activeResolveStatus,
              appState.activeResolvedIp,
              appState.resolveCheckDomain
            )
          : null;

        const isConfirming = confirmingDeleteId === p.id;
        const row = document.createElement('div');
        row.className = `dns-row ${isActive ? 'active' : ''} ${isLast ? 'last-row' : ''} ${focusedNavId === p.id ? 'kb-focused' : ''} ${justActivatedId === p.id ? 'just-activated' : ''} ${isConfirming ? 'confirming-delete' : ''}`;
        row.dataset.profileId = p.id;
        row.dataset.navId = p.id;
        row.addEventListener('mouseleave', () => {
          if (justActivatedId === p.id) {
            clearJustActivated();
          }
        });

        row.innerHTML = `
          ${isActive ? '<span class="active-bar" aria-hidden="true"></span>' : ''}
          <button type="button" class="row-main-btn" aria-pressed="${isActive}">
            ${ICONS.grip}
            <div class="row-info">
              <div class="row-title-line">
                <span class="row-name">${escHtml(p.name)}</span>
              </div>
              <div class="row-ips">${escHtml(ips)}</div>
            </div>
          </button>
          <div class="row-right">
            <div class="row-actions">
              ${renderRowActionsHtml(p, isConfirming)}
            </div>
            ${isActive ? `
              <div class="row-status">
                <button type="button" class="ping-btn ${lat.cls}" title="${escHtml(lat.title)}" aria-label="${escHtml(lat.title)}">${escHtml(lat.text)}</button>
                <span class="check-badge ${activeChanged ? 'check-pre-enter' : ''}">${ICONS.check}</span>
              </div>
            ` : ''}
          </div>
        `;

        const mainBtn = row.querySelector('.row-main-btn');
        mainBtn.addEventListener('pointerdown', (ev) => {
          if (ev.button !== 0 || draggingState) return;
          startRowDrag(ev, mainBtn, row, p.id, list);
        });
        mainBtn.addEventListener('click', () => {
          if ((draggingState && draggingState.moved) || performance.now() < suppressDragClickUntil) {
            return;
          }
          focusedNavId = null;
          playSound('activate');
          applyOptimisticActivation(p.id);
        });

        bindRowActionHandlers(row, p, isConfirming);
        const pingBtn = row.querySelector('.ping-btn');
        if (pingBtn) {
          pingBtn.onclick = (ev) => {
            ev.stopPropagation();
            playSound('click');
            postIpc({ type: 'probeActive' });
          };
        }

        list.appendChild(row);
      });
    }

    wrap.appendChild(list);
    mountViewPanel(main, wrap, animateView);
    if (prevScroll > 0) {
      list.style.scrollBehavior = 'auto';
      list.scrollTop = prevScroll;
      list.style.scrollBehavior = '';
    }
    attachScrollFade(list);

    if (activeChanged) {
      const enteringCheck = list.querySelector('.check-badge.check-pre-enter');
      if (enteringCheck) {
        void enteringCheck.offsetWidth;
        requestAnimationFrame(() => enteringCheck.classList.remove('check-pre-enter'));
      }
    }

    if (!animateView && prevBarTop !== null && activeChanged) {
      const nextBar = list.querySelector('.active-bar');
      if (nextBar && typeof nextBar.animate === 'function') {
        const barDy = prevBarTop - nextBar.getBoundingClientRect().top;
        if (Math.abs(barDy) >= 1) {
          nextBar.animate(
            [{ transform: `translateY(${barDy}px)` }, { transform: 'translateY(0)' }],
            { duration: 280, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
          );
        }
      }
    }
  }

  function startRowDrag(startEv, captureEl, row, profileId, listEl) {
    const startY = startEv.clientY;
    const pointerId = startEv.pointerId;
    const startScroll = listEl.scrollTop;
    let moved = false;
    let rafId = null;
    let latestClientY = startY;
    let rows = [];
    let dragIdx = -1;
    let slotTops = [];
    let slotMids = [];
    let heights = [];
    let targetIdx = -1;
    let clampedDy = 0;

    draggingState = { moved: false, profileId };
    try {
      captureEl.setPointerCapture(pointerId);
    } catch {}

    const initGeometry = () => {
      rows = Array.from(listEl.querySelectorAll('.dns-row[data-profile-id]'));
      dragIdx = rows.indexOf(row);
      targetIdx = dragIdx;
      const rects = rows.map((el) => el.getBoundingClientRect());
      slotTops = rects.map((r) => r.top + listEl.scrollTop);
      heights = rects.map((r) => r.height);
      slotMids = rects.map((r, i) => slotTops[i] + r.height / 2);

      listEl.classList.add('is-dragging');
      row.classList.add('dragging');
      rows.forEach((other) => {
        if (other !== row) other.classList.add('drag-neighbor');
      });
    };

    const applyFrame = () => {
      rafId = null;
      if (!moved || dragIdx < 0) return;

      const rawDy = latestClientY - startY + (listEl.scrollTop - startScroll);
      const dragHeight = heights[dragIdx];
      const minDy = slotTops[0] - slotTops[dragIdx];
      const lastIdx = rows.length - 1;
      const maxDy = slotTops[lastIdx] + heights[lastIdx] - (slotTops[dragIdx] + dragHeight);
      clampedDy = Math.max(minDy, Math.min(maxDy, rawDy));

      row.style.transform = `translate3d(0, ${clampedDy}px, 0)`;

      const draggedTop = slotTops[dragIdx] + clampedDy;
      const draggedBottom = draggedTop + dragHeight;
      let nextTarget = dragIdx;

      if (clampedDy < 0) {
        for (let i = 0; i < dragIdx; i++) {
          if (draggedTop < slotMids[i]) {
            nextTarget = i;
            break;
          }
        }
      } else if (clampedDy > 0) {
        for (let i = lastIdx; i > dragIdx; i--) {
          if (draggedBottom > slotMids[i]) {
            nextTarget = i;
            break;
          }
        }
      }

      if (nextTarget !== targetIdx) {
        targetIdx = nextTarget;
        rows.forEach((other, i) => {
          if (i === dragIdx) return;
          let shift = 0;
          if (targetIdx > dragIdx && i > dragIdx && i <= targetIdx) {
            shift = -dragHeight;
          } else if (targetIdx < dragIdx && i < dragIdx && i >= targetIdx) {
            shift = dragHeight;
          }
          other.style.transform = shift === 0 ? 'translate3d(0, 0, 0)' : `translate3d(0, ${shift}px, 0)`;
        });
      }
    };

    const onMove = (ev) => {
      if (ev.pointerId !== pointerId) return;
      latestClientY = ev.clientY;
      const dy = latestClientY - startY;
      if (!moved) {
        if (Math.abs(dy) < 5) return;
        moved = true;
        draggingState.moved = true;
        initGeometry();
      }
      if (rafId === null) {
        rafId = requestAnimationFrame(applyFrame);
      }
    };

    let finished = false;
    const finishDrag = (commit) => {
      if (finished) return;
      finished = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      captureEl.removeEventListener('pointermove', onMove);
      captureEl.removeEventListener('pointerup', onUp);
      captureEl.removeEventListener('pointercancel', onCancel);
      captureEl.removeEventListener('lostpointercapture', onCancel);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
      try {
        if (captureEl.hasPointerCapture(pointerId)) {
          captureEl.releasePointerCapture(pointerId);
        }
      } catch {}

      if (!moved || dragIdx < 0) {
        draggingState = null;
        if (pendingSyncPayload) {
          const next = pendingSyncPayload;
          pendingSyncPayload = null;
          setTimeout(() => {
            if (!draggingState) window.__shiftdnsSync(next);
          }, 0);
        }
        return;
      }

      suppressDragClickUntil = performance.now() + 80;
      const finalTarget = commit ? targetIdx : dragIdx;
      const finalOffset = slotTops[finalTarget] - slotTops[dragIdx];
      row.style.transition = 'transform 160ms cubic-bezier(0.2, 0, 0, 1)';
      row.style.transform = `translate3d(0, ${finalOffset}px, 0)`;

      setTimeout(() => {
        const reordered = rows.slice();
        if (finalTarget !== dragIdx) {
          const [item] = reordered.splice(dragIdx, 1);
          reordered.splice(finalTarget, 0, item);
        }

        listEl.classList.remove('is-dragging');
        rows.forEach((el) => {
          el.classList.remove('dragging', 'drag-neighbor');
          el.style.transform = '';
          el.style.transition = '';
        });

        reordered.forEach((el, idx) => {
          el.classList.toggle('last-row', idx === reordered.length - 1);
          listEl.appendChild(el);
        });

        const orderedIds = reordered.map((el) => el.dataset.profileId);
        if (finalTarget !== dragIdx) {
          const byId = new Map(appState.profiles.map((p) => [p.id, p]));
          const nextProfiles = orderedIds.map((id) => byId.get(id)).filter(Boolean);
          if (nextProfiles.length === appState.profiles.length) {
            appState.profiles = nextProfiles;
          }
          playSound('click');
          postIpc({ type: 'reorderProfiles', orderedIds });
        }

        draggingState = null;
        if (pendingSyncPayload) {
          const next = pendingSyncPayload;
          pendingSyncPayload = null;
          window.__shiftdnsSync(next);
        }
      }, 170);
    };

    const onUp = (ev) => {
      if (ev.pointerId !== pointerId) return;
      finishDrag(true);
    };

    const onCancel = (ev) => {
      if (ev.pointerId !== pointerId) return;
      finishDrag(false);
    };

    captureEl.addEventListener('pointermove', onMove);
    captureEl.addEventListener('pointerup', onUp);
    captureEl.addEventListener('pointercancel', onCancel);
    captureEl.addEventListener('lostpointercapture', onCancel);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }

  function isValidHostname(domain) {
    const clean = String(domain || '').trim().replace(/\.$/, '');
    if (!clean || clean.length > 253 || !clean.includes('.') || isValidIpv4(clean)) return false;
    const labels = clean.split('.');
    return (
      labels.length >= 2 &&
      labels.every(
        (l) => l.length >= 1 && l.length <= 63 && /^[a-zA-Z0-9-]+$/.test(l) && !l.startsWith('-') && !l.endsWith('-')
      )
    );
  }

  function isValidIpv4(ip) {
    const parts = ip.trim().split('.');
    if (parts.length !== 4) return false;
    return parts.every((part) => {
      if (!/^\d{1,3}$/.test(part)) return false;
      if (part.length > 1 && part.startsWith('0')) return false;
      const n = Number(part);
      return n >= 0 && n <= 255;
    });
  }

  function isValidIpv6(ip) {
    const t = ip.trim();
    if (!t || !t.includes(':') || t.includes(':::')) return false;
    const dc = t.split('::');
    if (dc.length > 2) return false;
    const ok = (gs) => gs.every((g) => /^[0-9a-fA-F]{1,4}$/.test(g));
    if (dc.length === 2) {
      const l = dc[0] ? dc[0].split(':') : [];
      const r = dc[1] ? dc[1].split(':') : [];
      return l.length + r.length < 8 && ok(l) && ok(r);
    }
    const gs = t.split(':');
    return gs.length === 8 && ok(gs);
  }

  function isValidDohUrl(url) {
    const t = url.trim();
    if (!t) return true;
    try { return new URL(t).protocol === 'https:'; } catch { return false; }

    if (e.key === 'Escape') {
      e.preventDefault();
      if (confirmingDeleteId !== null) {

      if (viewMode === 'add-dns') {

    const prevLatency = appState.activeLatency;
    const prevResolveStatus = appState.activeResolveStatus;

    const prevProbing = appState.probingActive;
    const prevDomain = appState.resolveCheckDomain;
    const becameError = Boolean(next.statusIsError) && !appState.statusIsError;

    if (!('activeLatency' in next)) {

    Object.assign(appState, next);

      if (viewMode === 'settings') {
        syncSettingsControls();
        const domainInput = document.getElementById('settings-resolve-domain');
        if (domainInput && document.activeElement !== domainInput && appState.resolveCheckDomain) {
          domainInput.value = appState.resolveCheckDomain;
        }
        renderUpdateRowState(
          document.getElementById('settings-update-sub'),
          document.getElementById('settings-update-slot')
        );
      }
    }
  };

  renderAll(false);
  postIpc({ type: 'ready' });
})();
</script>
</body>
</html>
