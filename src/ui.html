<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShiftDNS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font-sans: "Plus Jakarta Sans", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --ease-unslop: cubic-bezier(0.22, 1, 0.36, 1);

    --bg: #1C1E22;
    --chrome-bg: #17191D;
    --text: #F1F3F6;
    --text-muted: #8B92A0;
    --text-sub: #8B92A0;
    --text-soft: #B4BAC6;
    --text-footer: #8B92A0;
    --border: rgba(255, 255, 255, 0.08);
    --border-outer: #2E323B;
    --active-bg: #23262E;
    --active-border: rgba(255, 255, 255, 0.11);
    --hover-bg: #22252B;
    --icon-hover-bg: #292D36;
    --action-hover-bg: #303540;
    --accent: #4CC38A;
    --timeout: #E5484D;
    --input-bg: #15171B;
    --input-focus-bg: #191C21;
    --input-border: rgba(255, 255, 255, 0.11);
    --input-focus-border: rgba(241, 243, 246, 0.34);
    --input-placeholder: #6B7280;
    --btn-sec-bg: #272B33;
    --btn-sec-hover: #313640;
    --btn-sec-border: rgba(255, 255, 255, 0.12);
    --btn-sec-hover-border: rgba(255, 255, 255, 0.19);
    --btn-sec-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 1px 2px rgba(0, 0, 0, 0.28);
    --tooltip-bg: #232730;
    --tooltip-border: rgba(255, 255, 255, 0.12);
    --tooltip-text: #F1F3F6;
    --tooltip-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    --mono-accent: #F1F3F6;
    --mono-accent-hover: #FFFFFF;
    --mono-accent-text: #17191D;
    --save-bg: #D5DBE4;
    --save-hover: #E3E7EE;
    --save-text: #15171B;
    --save-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 1px 2px rgba(0, 0, 0, 0.28);
    --mono-focus-border: rgba(241, 243, 246, 0.34);
    --seg-bg: #15171B;
    --seg-border: rgba(255, 255, 255, 0.09);
    --seg-active-bg: #2F343E;
    --seg-active-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 1px 2px rgba(0, 0, 0, 0.22);
    --switch-off-bg: #14161A;
    --switch-off-border: rgba(255, 255, 255, 0.16);
    --switch-off-hover-border: rgba(255, 255, 255, 0.28);
    --switch-off-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.36);
    --switch-off-thumb: #B8BFC9;
    --switch-off-hover-thumb: #DDE1E8;
    --switch-on-bg: #D5DBE4;
    --switch-on-hover-bg: #E3E7EE;
    --switch-on-thumb: #15171B;
    --switch-thumb-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    --title-divider: rgba(255, 255, 255, 0.12);
    --kb-ring: rgba(255, 255, 255, 0.28);
    --scroll-thumb: rgba(255, 255, 255, 0.1);
    --scroll-thumb-hover: rgba(255, 255, 255, 0.22);
    --scroll-thumb-active: rgba(255, 255, 255, 0.36);
    --pill-hover: rgba(255, 255, 255, 0.06);
    --danger-bg: rgba(229, 72, 77, 0.14);
    --danger-border: rgba(229, 72, 77, 0.34);
    --danger-text: #F87171;
    --danger-hover-bg: #E5484D;
  }

  html.light {
    --bg: #FFFFFF;
    --chrome-bg: #FAFAFA;
    --text: #171717;
    --text-muted: #737373;
    --text-sub: #737373;
    --text-soft: #525252;
    --text-footer: #737373;
    --border: rgba(23, 23, 23, 0.08);
    --border-outer: #E4E4E7;
    --active-bg: #F4F4F5;
    --active-border: rgba(23, 23, 23, 0.1);
    --hover-bg: rgba(244, 244, 245, 0.75);
    --icon-hover-bg: #ECECEE;
    --action-hover-bg: #E4E4E7;
    --accent: #16A34A;
    --timeout: #DC2626;
    --input-bg: #F4F4F5;
    --input-focus-bg: #FFFFFF;
    --input-border: rgba(23, 23, 23, 0.1);
    --input-focus-border: rgba(23, 23, 23, 0.35);
    --input-placeholder: #9CA3AF;
    --btn-sec-bg: #FFFFFF;
    --btn-sec-hover: #F4F4F5;
    --btn-sec-border: rgba(23, 23, 23, 0.12);
    --btn-sec-hover-border: rgba(23, 23, 23, 0.18);
    --btn-sec-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    --tooltip-bg: #FFFFFF;
    --tooltip-border: #E4E4E7;
    --tooltip-text: #171717;
    --tooltip-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    --mono-accent: #171717;
    --mono-accent-hover: #2A2A2D;
    --mono-accent-text: #FFFFFF;
    --save-bg: #23252A;
    --save-hover: #32353C;
    --save-text: #FFFFFF;
    --save-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    --mono-focus-border: rgba(23, 23, 23, 0.35);
    --seg-bg: #F1F1F3;
    --seg-border: rgba(23, 23, 23, 0.08);
    --seg-active-bg: #FFFFFF;
    --seg-active-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
    --switch-off-bg: #E4E4E7;
    --switch-off-border: rgba(23, 23, 23, 0.22);
    --switch-off-hover-border: rgba(23, 23, 23, 0.32);
    --switch-off-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    --switch-off-thumb: #FFFFFF;
    --switch-off-hover-thumb: #FFFFFF;
    --switch-on-bg: #171717;
    --switch-on-hover-bg: #27272A;
    --switch-on-thumb: #FFFFFF;
    --switch-thumb-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    --title-divider: rgba(23, 23, 23, 0.12);
    --kb-ring: rgba(23, 23, 23, 0.22);
    --scroll-thumb: rgba(23, 23, 23, 0.09);
    --scroll-thumb-hover: rgba(23, 23, 23, 0.22);
    --scroll-thumb-active: rgba(23, 23, 23, 0.34);
    --pill-hover: rgba(23, 23, 23, 0.06);
    --danger-bg: rgba(220, 38, 38, 0.09);
    --danger-border: rgba(220, 38, 38, 0.25);
    --danger-text: #DC2626;
    --danger-hover-bg: #DC2626;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: clip;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app-shell {
    width: 100%;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-outer);
    border-radius: 8px;
    overflow: clip;
    display: flex;
    flex-direction: column;
    transform-origin: center center;
    will-change: opacity, transform;
    transition:
      opacity 130ms cubic-bezier(0.2, 0, 0, 1),
      transform 130ms cubic-bezier(0.2, 0, 0, 1),
      background-color 150ms var(--ease-unslop),
      color 150ms var(--ease-unslop),
      border-color 150ms var(--ease-unslop);
  }

  #main-body {
    flex: 1;
    min-height: 0;
    overflow: clip;
    display: flex;
    flex-direction: column;
  }

  .app-shell.win-hidden {
    opacity: 0;
    transform: scale(0.98);
    pointer-events: none;
  }

  .app-shell.win-no-transition {
    transition: none !important;
  }

  html.theme-transitioning .app-shell,
  html.theme-transitioning .app-shell *:not(.seg-indicator):not(.toggle-switch):not(.toggle-thumb) {
    transition-property: background-color, color, border-color, box-shadow, fill, stroke !important;
    transition-duration: 240ms !important;
    transition-timing-function: var(--ease-unslop) !important;
  }

  @media (prefers-reduced-motion: reduce) {
    html.theme-transitioning .app-shell,
    html.theme-transitioning .app-shell *,
    .adv-plus-v,
    .adv-collapse,
    .adv-fields,
    .adv-slot-reveal {
      transition-duration: 0ms !important;
      transition-delay: 0ms !important;
    }
  }

  html.suspend-hover .icon-btn:hover {
    color: var(--text-muted);
    background: transparent;
  }
  html.suspend-hover .dns-row:not(.active):hover { background: transparent; }
  html.suspend-hover .dns-row:hover .grip-icon { opacity: 0; }
  html.suspend-hover .dns-row:not(.confirming-delete):hover .row-actions { opacity: 0; pointer-events: none; }
  html.suspend-hover .dns-row:not(.confirming-delete):hover .row-status { opacity: 1; pointer-events: auto; }
  html.suspend-hover .settings-toggle-row:hover { background: transparent; }
  html.suspend-hover .settings-action-btn:hover,
  html.suspend-hover .empty-restore-btn:hover { background: var(--btn-sec-bg); border-color: var(--btn-sec-border); }
  html.suspend-hover .adapter-pill:hover { background: transparent; }
  html.suspend-hover .adapter-pill:hover .adapter-text { color: var(--text-soft); }
  html.suspend-hover .tooltip { opacity: 0 !important; }

  /* Titlebar */
  .titlebar {
    height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .title-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .icon-btn.back-icon { margin-left: -6px; }

  .drag-spacer {
    flex: 1;
    height: 100%;
    min-width: 20px;
  }

  .title-controls {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .title-divider {
    width: 1px;
    height: 14px;
    margin: 0 5px;
    background: var(--title-divider);
    flex-shrink: 0;
  }

  .icon-btn-wrap {
    position: relative;
    display: inline-flex;
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 150ms var(--ease-unslop), background-color 150ms var(--ease-unslop);
  }

  .icon-btn:hover {
    color: var(--text);
    background: var(--icon-hover-bg);
  }

  .icon-btn:active { transform: scale(0.95); }
  .icon-btn:disabled { opacity: 0.42; cursor: not-allowed; }
  .icon-btn:disabled:hover { color: var(--text-muted); background: transparent; }
  .icon-btn:disabled:active { transform: none; }
  .icon-btn:focus-visible { outline: 1px solid var(--kb-ring); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* Tooltip: initial={{ opacity: 0, y: 3, scale: 0.96 }} -> animate={{ opacity: 1, y: 0, scale: 1 }}, 120ms cubic-bezier(0.22, 1, 0.36, 1) */
  .tooltip {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(3px) scale(0.96);
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--tooltip-bg);
    border: 1px solid var(--tooltip-border);
    color: var(--tooltip-text);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: var(--tooltip-shadow);
    pointer-events: none;
    opacity: 0;
    z-index: 40;
    transition: opacity 120ms var(--ease-unslop), transform 120ms var(--ease-unslop);
  }

  .tooltip.right {
    left: auto;
    right: 0;
    transform: translateY(3px) scale(0.96);
  }

  .tooltip.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  .tooltip.right.show {
    transform: translateY(0) scale(1);
  }

  /* View panel transitions: initial={{ opacity: 0, y: 4 }}, animate={{ opacity: 1, y: 0 }}, exit={{ opacity: 0, y: -4 }}, duration: 0.15 */
  .view-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 150ms ease, transform 150ms ease;
  }

  .view-panel.view-pre-enter {
    opacity: 0;
    transform: translateY(4px);
  }

  .view-panel.view-exiting {
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
  }

  /* Checkmark transitions: initial={{ opacity: 0, scale: 0.8 }}, animate={{ opacity: 1, scale: 1 }}, duration: 0.15 */
  .check-badge {
    display: inline-flex;
    flex-shrink: 0;
    transition: opacity 150ms ease, transform 150ms ease;
  }

  .check-badge.check-pre-enter {
    opacity: 0;
    transform: scale(0.8);
  }

  /* Smooth Scroll Containers (204px body = DHCP + 3 DNS rows, scrolls smoothly from 4th row) */
  .dns-list,
  .settings-scroll,
  .form-scroll {
    flex: 1;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    padding-bottom: 0;
  }

  .dns-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 3px 8px;
  }

  .settings-scroll {
    padding-bottom: 6px;
  }

  .scroll-fade.fade-bottom {
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 28px), transparent 100%);
  }

  .scroll-fade.fade-top {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 100%);
  }

  .scroll-fade.fade-top.fade-bottom {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 24px, #000 calc(100% - 28px), transparent 100%);
  }

  @supports (-moz-appearance: none) {
    .dns-list,
    .settings-scroll,
    .form-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.14) transparent;
    }
    html.light .dns-list,
    html.light .settings-scroll,
    html.light .form-scroll {
      scrollbar-color: rgba(23, 23, 23, 0.14) transparent;
    }
  }

  .dns-list::-webkit-scrollbar,
  .settings-scroll::-webkit-scrollbar,
  .form-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .dns-list::-webkit-scrollbar-track,
  .settings-scroll::-webkit-scrollbar-track,
  .form-scroll::-webkit-scrollbar-track { background: transparent; }
  .dns-list::-webkit-scrollbar-button,
  .settings-scroll::-webkit-scrollbar-button,
  .form-scroll::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  .dns-list::-webkit-scrollbar-thumb,
  .settings-scroll::-webkit-scrollbar-thumb,
  .form-scroll::-webkit-scrollbar-thumb {
    background-color: var(--scroll-thumb);
    border-radius: 9999px;
  }
  .dns-list:hover::-webkit-scrollbar-thumb,
  .settings-scroll:hover::-webkit-scrollbar-thumb,
  .form-scroll:hover::-webkit-scrollbar-thumb { background-color: var(--scroll-thumb-hover); }
  .dns-list::-webkit-scrollbar-thumb:hover,
  .settings-scroll::-webkit-scrollbar-thumb:hover,
  .form-scroll::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-active); }

  .dns-row {
    position: relative;
    width: 100%;
    height: 48px;
    min-height: 48px;
    flex-shrink: 0;
    box-sizing: border-box;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: transparent;
    transition: background-color 150ms ease;
  }

  .dns-row:not(.active):hover { background: var(--hover-bg); }
  .dns-row.kb-focused {
    box-shadow: inset 0 0 0 1px var(--kb-ring);
    background: var(--hover-bg);
  }
  .dns-row.dragging {
    position: relative;
    background: var(--active-bg);
    box-shadow: inset 0 0 0 1px var(--active-border), 0 10px 28px rgba(0, 0, 0, 0.45);
    z-index: 25;
    transition: none;
    will-change: transform;
    pointer-events: none;
  }

  html.light .dns-row.dragging {
    box-shadow: inset 0 0 0 1px var(--active-border), 0 8px 20px rgba(0, 0, 0, 0.1);
  }

  .dns-row.drag-neighbor {
    transition: transform 200ms cubic-bezier(0.2, 0, 0, 1);
    will-change: transform;
  }

  .dns-list.is-dragging .dns-row:not(.dragging):hover {
    background: transparent;
  }
  .dns-list.is-dragging .dns-row:not(.dragging):hover .row-actions {
    opacity: 0;
    pointer-events: none;
  }
  .dns-list.is-dragging .dns-row:not(.dragging):hover .row-status {
    opacity: 1;
  }
  .dns-list.is-dragging .dns-row:not(.dragging):hover .grip-icon {
    opacity: 0;
  }

  .active-card {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: var(--active-bg);
    border: 1px solid var(--active-border);
    pointer-events: none;
    z-index: 0;
  }

  .dhcp-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    padding: 6px 14px 6px 18px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: inherit;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    cursor: pointer;
  }

  .row-main-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 6px 8px 6px 18px;
    border: 0;
    border-radius: 10px 0 0 10px;
    background: transparent;
    color: inherit;
    font-family: inherit;
    display: flex;
    align-items: center;
    text-align: left;
    cursor: grab;
    touch-action: none;
  }

  .row-main-btn:active { cursor: grabbing; }
  .row-main-btn:focus, .dhcp-btn:focus { outline: none; }

  .grip-icon {
    position: absolute;
    left: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 12px;
    color: var(--text-muted);
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease;
  }

  @media (hover: hover) {
    .dns-row:hover .grip-icon { opacity: 0.55; }
  }

  .row-info { min-width: 0; flex: 1; }

  .row-title-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .row-name {
    font-size: 13px;
    line-height: 18px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dns-row.active .row-name {
    font-weight: 600;
  }

  .row-ips,
  .row-sub {
    font-size: 12px;
    line-height: 16px;
    margin-top: 1px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-ips {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .row-right {
    position: relative;
    z-index: 1;
    padding-right: 14px;
    display: inline-grid;
    align-items: center;
    justify-items: end;
    flex-shrink: 0;
  }

  .row-actions, .row-status {
    grid-column: 1;
    grid-row: 1;
    justify-self: end;
    display: flex;
    align-items: center;
  }

  .row-actions {
    gap: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease;
  }

  .row-status {
    gap: 8px;
    opacity: 1;
    pointer-events: auto;
    transition: opacity 150ms ease;
  }

  @media (hover: hover) {
    .dns-row:not(.just-activated):hover .row-actions {
      opacity: 1;
      pointer-events: auto;
    }
    .dns-row:not(.just-activated):hover .row-status {
      opacity: 0;
      pointer-events: none;
    }
  }

  .dns-row:has(.row-actions:focus-within) .row-actions,
  .dns-row.confirming-delete .row-actions {
    opacity: 1;
    pointer-events: auto;
  }

  .dns-row:has(.row-actions:focus-within) .row-status,
  .dns-row.confirming-delete .row-status {
    opacity: 0;
    pointer-events: none;
  }

  .action-btn {
    padding: 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 150ms ease, background-color 150ms ease;
  }

  .action-btn:hover {
    color: var(--text);
    background: var(--action-hover-bg);
  }

  .action-btn.delete:hover {
    color: var(--timeout);
  }

  .action-btn:focus-visible { outline: 1px solid var(--kb-ring); }
  .action-btn svg { width: 14px; height: 14px; }

  .confirm-delete-btn {
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--danger-border);
    border-radius: 6px;
    background: var(--danger-bg);
    color: var(--danger-text);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 140ms var(--ease-unslop), border-color 140ms var(--ease-unslop), color 140ms var(--ease-unslop), transform 140ms var(--ease-unslop);
  }

<script>

  let audioCtx = null;
  function playSound(cue, forceEnabled) {
    if (!(forceEnabled === undefined ? appState.soundEffects : forceEnabled)) return;
    const steps = SOUND_RECIPES[cue];
    if (!steps) return;
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      if (!audioCtx) audioCtx = new Ctor();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3000, audioCtx.currentTime);
      if (filter.Q) filter.Q.setValueAtTime(0.7, audioCtx.currentTime);
      filter.connect(audioCtx.destination);
      const base = audioCtx.currentTime + 0.002;
      for (const s of steps) {
        const start = base + s.delay;
        const end = start + s.dur;
        const atk = Math.min(0.004, s.dur * 0.25);
        const osc = audioCtx.createOscillator();
        osc.type = s.type;
        osc.frequency.setValueAtTime(s.f0, start);
        if (s.f1 && s.f1 !== s.f0) osc.frequency.exponentialRampToValueAtTime(s.f1, end);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(s.gain, start + atk);
        gain.gain.exponentialRampToValueAtTime(0.0001, end);
        osc.connect(gain);
        gain.connect(filter);
        osc.start(start);
        osc.stop(end + 0.008);
      }
    } catch {}
  }

  let viewMode = 'servers'; // 'servers' | 'settings' | 'add-dns'

  let suppressDragClickUntil = 0;
  let pendingSyncPayload = null;
  let manualPingAllInFlight = false;

  function postIpc(msg) {
    if (window.ipc && typeof window.ipc.postMessage === 'function') {
      window.ipc.postMessage(JSON.stringify(msg));
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function latencyInfo(ms, probing, resolveStatus, resolvedIp, domain) {
    const host = domain || 'cloudflare.com';
    if (probing || ms === undefined) {
      return { text: '...', cls: 'ping-none', title: `Testing ${host} (port 53)...` };
    }
    if (ms === null || resolveStatus === 'timeout') {
      return {
        text: 'Timeout',
        cls: 'ping-timeout',
        title: `Timeout resolving ${host}`,
      };
    }
    if (resolveStatus === 'blocked') {
      return {
        text: 'Blocked',
        cls: 'ping-timeout',
        title: `Blocked: ${host} → ${resolvedIp || '0.0.0.0'}`,
      };
    }
    if (resolveStatus === 'no_answer') {
      return {
        text: 'No IP',
        cls: 'ping-slow',
        title: `No A record for ${host}`,
      };
    }
    const cls = ms <= 18 ? 'ping-fast' : ms <= 27 ? 'ping-medium' : 'ping-slow';
    const title = resolvedIp
      ? `${host} → ${resolvedIp}`
      : `Resolved ${host} (port 53)`;
    return { text: `${ms} ms`, cls, title };
  }

  const systemThemeQuery =
    typeof window.matchMedia === 'function'
      ? window.matchMedia('(prefers-color-scheme: dark)')
      : null;

  function resolveThemeDark(mode) {
    if (mode === 'dark') return true;
    if (mode === 'light') return false;
    return systemThemeQuery ? systemThemeQuery.matches : true;
  }

  let themeTransitionTimer = null;
  let hasReceivedSync = false;

  function applyTheme(animate = false) {
    const root = document.documentElement;
    const nextLight = !appState.darkMode;
    const changed = root.classList.contains('light') !== nextLight;
    if (animate && changed) {
      root.classList.add('theme-transitioning');
      void root.offsetWidth;
      if (themeTransitionTimer) clearTimeout(themeTransitionTimer);
      themeTransitionTimer = setTimeout(() => {
        root.classList.remove('theme-transitioning');
        themeTransitionTimer = null;
      }, 280);
    }
    root.classList.toggle('light', nextLight);
  }

  if (systemThemeQuery && typeof systemThemeQuery.addEventListener === 'function') {

  function clearHoverAndTooltipState() {
    activeTooltipHiders.forEach((hide) => hide());

  let pendingHideCleanup = null;

  function cancelPendingHide() {
    if (pendingHideCleanup) {
      pendingHideCleanup();
      pendingHideCleanup = null;
    }
  }

  function animateHideAndPost(target = 'tray') {
    const isTaskbar = target === 'taskbar';
    const beginType = isTaskbar ? 'beginMinimize' : 'beginHide';
    const finishType = isTaskbar ? 'minimizeWindow' : 'hideWindow';
    const shell = document.getElementById('app-shell');
    clearHoverAndTooltipState();
    postIpc({ type: beginType });

    if (!shell) {
      postIpc({ type: finishType });
      return;
    }

    if (shell.classList.contains('win-hidden')) {
      cancelPendingHide();
      postIpc({ type: finishType });
      return;
    }

    if (pendingHideCleanup) return;

    let done = false;
    let fallbackTimer = null;

    const cleanup = () => {
      shell.removeEventListener('transitionend', onEnd);
      if (fallbackTimer !== null) {
        clearTimeout(fallbackTimer);
        fallbackTimer = null;
      }
      pendingHideCleanup = null;
    };

    const complete = () => {
      if (done) return;
      done = true;
      cleanup();
      postIpc({ type: finishType });
    };

    const onEnd = (ev) => {
      if (ev.target === shell && (ev.propertyName === 'opacity' || ev.propertyName === 'transform')) {
        complete();
      }
    };

    pendingHideCleanup = () => {
      done = true;
      cleanup();
    };

    shell.classList.remove('win-no-transition');
    void shell.offsetWidth;
    shell.addEventListener('transitionend', onEnd);
    fallbackTimer = setTimeout(complete, 175);
    shell.classList.add('win-hidden');
  }

  window.__shiftdnsPrepareShow = function () {
    cancelPendingHide();
    clearHoverAndTooltipState();
    const shell = document.getElementById('app-shell');
    if (!shell) return;
    shell.classList.add('win-no-transition', 'win-hidden');
    void shell.offsetWidth;

    if (!shell) return;
    shell.classList.add('win-no-transition', 'win-hidden');
    void shell.offsetWidth;
    requestAnimationFrame(() => {
      shell.classList.remove('win-no-transition');
      void shell.offsetWidth;
      shell.classList.remove('win-hidden');
    });
  };

  window.__shiftdnsAnimateHide = function () {

  function attachTooltipBehavior(btnWrap, tooltipEl) {
    let timer = null;
    const btn = btnWrap.querySelector('button');
    const show = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        if (!document.documentElement.classList.contains('suspend-hover')) {
          tooltipEl.classList.add('show');
        }
      }, 150);
    };
    const hide = () => {
      if (timer) { clearTimeout(timer); timer = null; }
      tooltipEl.classList.remove('show');
    };
    activeTooltipHiders.add(hide);
    btnWrap.addEventListener('mouseenter', show);
    btnWrap.addEventListener('mouseleave', hide);
    btnWrap.addEventListener('pointerdown', hide);
    btn.addEventListener('pointerdown', hide);
    btn.addEventListener('focus', () => {
      if (btn.matches(':focus-visible')) show();
    });
    btn.addEventListener('blur', hide);
  }

    } else if (viewMode === 'add-dns') {

    const addControl = (id, label, tooltip, iconHtml, alignRight, onClick) => {
      const wrap = document.createElement('div');

      attachTooltipBehavior(wrap, wrap.querySelector('.tooltip'));

    };

    if (viewMode === 'servers') {
      addControl(
        'btn-ping-all',
        'Ping all DNS servers',
        appState.pingingAll ? 'Pinging DNS...' : 'Ping all DNS',
        appState.pingingAll ? ICONS.pingSpinner : ICONS.activity,
        false,
        () => {
          if (appState.pingingAll || appState.profiles.length === 0) return;
          playSound('ping');

          appState.profileProbes = {};
          syncPingAllButton();
          updateAllPingsInPlace();
          postIpc({ type: 'pingAll' });
        }
      );
      const pingBtn = document.getElementById('btn-ping-all');
      if (pingBtn) {
        pingBtn.disabled = appState.pingingAll || appState.profiles.length === 0;
      }
      addControl('btn-add', 'Add custom DNS', 'Add DNS (Ctrl+N)', ICONS.plus, false, () => {
        playSound('click');
        openAddForm('servers');
      });
      addControl('btn-settings', 'Settings', 'Settings', ICONS.settings, false, () => {
        playSound('click');
        transitionView('settings');
      });
      const divider = document.createElement('span');
      divider.className = 'title-divider';
      divider.setAttribute('aria-hidden', 'true');
      controls.appendChild(divider);
    }
    addControl('btn-close', 'Close ShiftDNS to system tray', 'Close to tray (Esc)', ICONS.x, true, () => {
      playSound('click');
      animateHideAndPost('tray');
    });

  let lastStatusMessage = null;
  let statusAnimTimer = null;

  function renderFooter() {
    document.getElementById('adapter-label').textContent = appState.adapterLabel;
    const statusEl = document.getElementById('status-message');
    const nextMsg = appState.statusMessage;
    const baseCls = 'status-msg' + (appState.statusIsError ? ' error' : '');

    if (lastStatusMessage === null) {
      lastStatusMessage = nextMsg;
      statusEl.textContent = nextMsg;
      statusEl.className = baseCls;
      return;
    }

    if (nextMsg !== lastStatusMessage) {
      lastStatusMessage = nextMsg;
      if (statusAnimTimer) clearTimeout(statusAnimTimer);
      statusEl.className = `${baseCls} status-exiting`;
      statusAnimTimer = setTimeout(() => {
        statusAnimTimer = null;
        statusEl.textContent = appState.statusMessage;
        const enteredCls = 'status-msg' + (appState.statusIsError ? ' error' : '');

        void statusEl.offsetWidth;
        requestAnimationFrame(() => {
          statusEl.className = enteredCls;
        });
      }, 150);
    } else if (!statusAnimTimer) {
      statusEl.className = baseCls;
    }
  }

  let viewTransitionTimer = null;
  let lastActiveProfileId = null;

  function transitionView(nextView, beforeEnter) {
    activeTooltipHiders.forEach((hide) => hide());
    if (viewTransitionTimer) {
      clearTimeout(viewTransitionTimer);
      viewTransitionTimer = null;
    }
    const main = document.getElementById('main-body');
    const currentChild = main && main.firstElementChild;
    if (currentChild) {
      currentChild.classList.add('view-exiting');
      viewTransitionTimer = setTimeout(() => {
        viewTransitionTimer = null;
        if (beforeEnter) beforeEnter();
        viewMode = nextView;
        renderAll(true);
      }, 150);
    } else {
      if (beforeEnter) beforeEnter();
      viewMode = nextView;
      renderAll(true);
    }
  }

  function renderBody(animateView) {
    const main = document.getElementById('main-body');
    const prevList = document.getElementById('dns-list');
    const prevScroll = prevList ? prevList.scrollTop : 0;

    // Capture active card position so the rounded highlight glides smoothly to the newly selected row
    let prevCardTop = null;
    if (prevList && viewMode === 'servers') {
      const prevCard = prevList.querySelector('.active-card');
      if (prevCard) prevCardTop = prevCard.getBoundingClientRect().top;
    }

    if (viewMode === 'settings') {
      renderSettingsView(main, animateView);
    } else if (viewMode === 'add-dns') {
      renderFormView(main, animateView);
    } else {
      renderServersView(main, animateView, prevScroll, prevCardTop);
    }
  }

  function mountViewPanel(main, wrap, animateView) {
    wrap.className = animateView ? 'view-panel view-pre-enter' : 'view-panel';
    main.replaceChildren(wrap);
    if (animateView) {
      void wrap.offsetWidth;
      requestAnimationFrame(() => {
        wrap.classList.remove('view-pre-enter');
      });
    }
  }

  function updateScrollFade(el) {
    if (!el) return;
    const maxScroll = el.scrollHeight - el.clientHeight;
    const hasOverflow = maxScroll > 2;
    const showTop = hasOverflow && el.scrollTop > 2;
    const showBottom = hasOverflow && el.scrollTop < maxScroll - 2;
    el.classList.toggle('fade-top', showTop);
    el.classList.toggle('fade-bottom', showBottom);

  let justActivatedId = null;
  let justActivatedTimer = null;

  function bindRowActionHandlers(row, p, isConfirming) {
    if (isConfirming) {
      const confirmBtn = row.querySelector('.confirm-delete-btn');
      const cancelBtn = row.querySelector('.action-btn.cancel-delete');
      if (confirmBtn) {
        confirmBtn.onclick = (ev) => {
          ev.stopPropagation();
          clearConfirmDelete(false);
          playSound('delete');
          postIpc({ type: 'deleteProfile', id: p.id });
        };
      }
      if (cancelBtn) {
        cancelBtn.onclick = (ev) => {
          ev.stopPropagation();
          playSound('click');
          clearConfirmDelete(true);
        };
      }

      const editBtn = row.querySelector('.action-btn.edit');
      const deleteBtn = row.querySelector('.action-btn.delete');
      if (editBtn) {
        editBtn.onclick = (ev) => {
          ev.stopPropagation();
          clearConfirmDelete(false);
          playSound('click');
          openEditForm(p);
        };
      }
      if (deleteBtn) {
        deleteBtn.onclick = (ev) => {
          ev.stopPropagation();
          playSound('click');
          armConfirmDelete(p.id);

  function renderRowActionsHtml(p, isConfirming) {

  function patchRowConfirmUi(profileId, isConfirming) {
    const row = document.querySelector(`.dns-row[data-profile-id="${CSS.escape(profileId)}"]`);
    if (!row) return;
    const profile = appState.profiles.find((p) => p.id === profileId);

    const actionsEl = row.querySelector('.row-actions');
    if (actionsEl && profile) {

  function clearConfirmDelete(updateDom = false) {
    if (confirmingDeleteTimer !== null) {
      clearTimeout(confirmingDeleteTimer);
      confirmingDeleteTimer = null;
    }
    if (confirmingDeleteId !== null) {
      const prevId = confirmingDeleteId;
      confirmingDeleteId = null;
      if (updateDom && viewMode === 'servers') {
        patchRowConfirmUi(prevId, false);
      }
    }
  }

  function armConfirmDelete(profileId) {
    if (confirmingDeleteId !== null && confirmingDeleteId !== profileId) {
      clearConfirmDelete(true);
    } else if (confirmingDeleteTimer !== null) {
      clearTimeout(confirmingDeleteTimer);
      confirmingDeleteTimer = null;
    }
    confirmingDeleteId = profileId;
    patchRowConfirmUi(profileId, true);
    confirmingDeleteTimer = setTimeout(() => {
      confirmingDeleteTimer = null;
      if (confirmingDeleteId === profileId) {
        confirmingDeleteId = null;
        if (viewMode === 'servers') patchRowConfirmUi(profileId, false);
      }

      clearTimeout(justActivatedTimer);
      justActivatedTimer = null;

      if (prevRow) prevRow.classList.remove('just-activated');

  function holdActivePing(profileId, ms) {

      clearTimeout(justActivatedTimer);
      justActivatedTimer = null;
    }
    if (!profileId) {
      clearJustActivated();
      return;
    }
    justActivatedId = profileId;
    justActivatedTimer = setTimeout(() => {
      clearJustActivated();
    }, ms);
  }

    clearConfirmDelete(false);
    const selected = targetId ? appState.profiles.find((p) => p.id === targetId) || null : null;
    if (targetId) {
      holdActivePing(targetId, 3200);

    appState.activeLatency = undefined;

    const tip = pingBtn.parentElement && pingBtn.parentElement.querySelector('.tooltip');
    if (tip) {

  function getRowLatencyInfo(profileId, isActive) {
    if (isActive) {
      return latencyInfo(
        appState.activeLatency,
        appState.probingActive,
        appState.activeResolveStatus,
        appState.activeResolvedIp,
        appState.resolveCheckDomain
      );
    }
    const probe = appState.profileProbes && appState.profileProbes[profileId];
    if (probe) {
      return latencyInfo(
        probe.rttMs,
        false,
        probe.status,
        probe.resolvedIp,
        appState.resolveCheckDomain
      );
    }
    if (appState.pingingAll) {

    const list = document.getElementById('dns-list');

    if (!rows.length && appState.profiles.length > 0) return false;
    rows.forEach((row) => {
      const id = row.dataset.profileId;
      const isActive = appState.activeProfileId === id;
      const statusEl = row.querySelector('.row-status');
      if (!statusEl) return;
      const lat = getRowLatencyInfo(id, isActive);
      let pingEl = statusEl.querySelector('.ping-badge');
      if (lat) {
        if (!pingEl) {

          statusEl.insertBefore(pingEl, statusEl.firstChild);

        pingEl.className = `ping-badge ${lat.cls}`;
        pingEl.textContent = lat.text;
        pingEl.title = lat.title;
      } else if (pingEl) {
        pingEl.remove();
      }
      if (isActive && !appState.probingActive && justActivatedId === id) {
        holdActivePing(id, 2400);

    });
    return true;

  let activeScrollObserver = null;
  function attachScrollFade(el) {
    if (activeScrollObserver) {
      activeScrollObserver.disconnect();
      activeScrollObserver = null;
    }
    if (!el) return;
    const sync = () => updateScrollFade(el);
    el.addEventListener('scroll', sync, { passive: true });
    if (typeof ResizeObserver === 'function') {
      activeScrollObserver = new ResizeObserver(sync);
      activeScrollObserver.observe(el);
      if (el.firstElementChild) {
        activeScrollObserver.observe(el.firstElementChild);
      }
    }
    sync();
    requestAnimationFrame(sync);
    setTimeout(sync, 170);
  }

  function startRowDrag(startEv, captureEl, row, profileId, listEl) {
    const startY = startEv.clientY;
    const pointerId = startEv.pointerId;
    const startScroll = listEl.scrollTop;
    let moved = false;
    let rafId = null;
    let latestClientY = startY;
    let rows = [];
    let dragIdx = -1;
    let slotTops = [];
    let slotMids = [];
    let heights = [];
    let targetIdx = -1;
    let clampedDy = 0;

    draggingState = { moved: false, profileId };
    try {
      captureEl.setPointerCapture(pointerId);
    } catch {}

    const initGeometry = () => {
      rows = Array.from(listEl.querySelectorAll('.dns-row[data-profile-id]'));
      dragIdx = rows.indexOf(row);
      targetIdx = dragIdx;
      const rects = rows.map((el) => el.getBoundingClientRect());
      slotTops = rects.map((r) => r.top + listEl.scrollTop);
      heights = rects.map((r) => r.height);
      slotMids = rects.map((r, i) => slotTops[i] + r.height / 2);

      listEl.classList.add('is-dragging');
      row.classList.add('dragging');
      rows.forEach((other) => {
        if (other !== row) other.classList.add('drag-neighbor');
      });
    };

    const applyFrame = () => {
      rafId = null;
      if (!moved || dragIdx < 0) return;

      const rawDy = latestClientY - startY + (listEl.scrollTop - startScroll);
      const dragHeight = heights[dragIdx];
      const minDy = slotTops[0] - slotTops[dragIdx];
      const lastIdx = rows.length - 1;
      const maxDy = slotTops[lastIdx] + heights[lastIdx] - (slotTops[dragIdx] + dragHeight);
      clampedDy = Math.max(minDy, Math.min(maxDy, rawDy));

      row.style.transform = `translate3d(0, ${clampedDy}px, 0)`;

      const draggedTop = slotTops[dragIdx] + clampedDy;
      const draggedBottom = draggedTop + dragHeight;
      let nextTarget = dragIdx;

      if (clampedDy < 0) {
        for (let i = 0; i < dragIdx; i++) {
          if (draggedTop < slotMids[i]) {
            nextTarget = i;
            break;
          }
        }
      } else if (clampedDy > 0) {
        for (let i = lastIdx; i > dragIdx; i--) {
          if (draggedBottom > slotMids[i]) {
            nextTarget = i;
            break;
          }
        }
      }

      if (nextTarget !== targetIdx) {
        targetIdx = nextTarget;
        const rowStep = rows.length > 1 ? slotTops[1] - slotTops[0] : dragHeight;
        rows.forEach((other, i) => {
          if (i === dragIdx) return;
          let shift = 0;
          if (targetIdx > dragIdx && i > dragIdx && i <= targetIdx) {
            shift = -rowStep;
          } else if (targetIdx < dragIdx && i < dragIdx && i >= targetIdx) {
            shift = rowStep;
          }
          other.style.transform = shift === 0 ? 'translate3d(0, 0, 0)' : `translate3d(0, ${shift}px, 0)`;
        });
      }
    };

    const onMove = (ev) => {
      if (ev.pointerId !== pointerId) return;
      latestClientY = ev.clientY;
      const dy = latestClientY - startY;
      if (!moved) {
        if (Math.abs(dy) < 5) return;
        moved = true;
        draggingState.moved = true;
        initGeometry();
      }
      if (rafId === null) {
        rafId = requestAnimationFrame(applyFrame);
      }
    };

    let finished = false;
    const finishDrag = (commit) => {
      if (finished) return;
      finished = true;
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      captureEl.removeEventListener('pointermove', onMove);
      captureEl.removeEventListener('pointerup', onUp);
      captureEl.removeEventListener('pointercancel', onCancel);
      captureEl.removeEventListener('lostpointercapture', onCancel);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
      try {
        if (captureEl.hasPointerCapture(pointerId)) {
          captureEl.releasePointerCapture(pointerId);
        }
      } catch {}

      if (!moved || dragIdx < 0) {
        draggingState = null;
        if (pendingSyncPayload) {
          const next = pendingSyncPayload;
          pendingSyncPayload = null;
          setTimeout(() => {
            if (!draggingState) window.__shiftdnsSync(next);
          }, 0);
        }
        return;
      }

      suppressDragClickUntil = performance.now() + 80;
      const finalTarget = commit ? targetIdx : dragIdx;
      const finalOffset = slotTops[finalTarget] - slotTops[dragIdx];
      row.style.transition = 'transform 160ms cubic-bezier(0.2, 0, 0, 1)';
      row.style.transform = `translate3d(0, ${finalOffset}px, 0)`;

      setTimeout(() => {
        const reordered = rows.slice();
        if (finalTarget !== dragIdx) {
          const [item] = reordered.splice(dragIdx, 1);
          reordered.splice(finalTarget, 0, item);
        }

        listEl.classList.remove('is-dragging');
        rows.forEach((el) => {
          el.classList.remove('dragging', 'drag-neighbor');
          el.style.transform = '';
          el.style.transition = '';
        });

        reordered.forEach((el, idx) => {
          el.classList.toggle('last-row', idx === reordered.length - 1);
          listEl.appendChild(el);
        });

        const orderedIds = reordered.map((el) => el.dataset.profileId);
        if (finalTarget !== dragIdx) {
          const byId = new Map(appState.profiles.map((p) => [p.id, p]));
          const nextProfiles = orderedIds.map((id) => byId.get(id)).filter(Boolean);
          if (nextProfiles.length === appState.profiles.length) {
            appState.profiles = nextProfiles;
          }
          playSound('click');
          postIpc({ type: 'reorderProfiles', orderedIds });
        }

        draggingState = null;
        if (pendingSyncPayload) {
          const next = pendingSyncPayload;
          pendingSyncPayload = null;
          window.__shiftdnsSync(next);
        }
      }, 170);
    };

    const onUp = (ev) => {
      if (ev.pointerId !== pointerId) return;
      finishDrag(true);
    };

    const onCancel = (ev) => {
      if (ev.pointerId !== pointerId) return;
      finishDrag(false);
    };

    captureEl.addEventListener('pointermove', onMove);
    captureEl.addEventListener('pointerup', onUp);
    captureEl.addEventListener('pointercancel', onCancel);
    captureEl.addEventListener('lostpointercapture', onCancel);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }

  function isValidHostname(domain) {
    const clean = String(domain || '').trim().replace(/\.$/, '');
    if (!clean || clean.length > 253 || !clean.includes('.') || isValidIpv4(clean)) return false;
    const labels = clean.split('.');
    return (
      labels.length >= 2 &&
      labels.every(
        (l) => l.length >= 1 && l.length <= 63 && /^[a-zA-Z0-9-]+$/.test(l) && !l.startsWith('-') && !l.endsWith('-')
      )
    );
  }

    wrap.querySelectorAll('button[data-theme-btn]').forEach((btn) => {

  function openAddForm(returnTo = 'servers') {

  function openEditForm(profile) {

      formReturnView = 'servers';
    });
  }

  function isValidIpv4(ip) {
    const parts = ip.trim().split('.');
    if (parts.length !== 4) return false;
    return parts.every((part) => {
      if (!/^\d{1,3}$/.test(part)) return false;
      if (part.length > 1 && part.startsWith('0')) return false;
      const n = Number(part);
      return n >= 0 && n <= 255;
    });
  }

  function isValidIpv6(ip) {
    const t = ip.trim();
    if (!t || !t.includes(':') || t.includes(':::')) return false;
    const dc = t.split('::');
    if (dc.length > 2) return false;
    const ok = (gs) => gs.every((g) => /^[0-9a-fA-F]{1,4}$/.test(g));
    if (dc.length === 2) {
      const l = dc[0] ? dc[0].split(':') : [];
      const r = dc[1] ? dc[1].split(':') : [];
      return l.length + r.length < 8 && ok(l) && ok(r);
    }
    const gs = t.split(':');
    return gs.length === 8 && ok(gs);
  }

  function isValidDohUrl(url) {
    const t = url.trim();
    if (!t) return true;
    try { return new URL(t).protocol === 'https:'; } catch { return false; }
  }

  function renderFormView(main, animateView) {
    const wrap = document.createElement('div');

    const p = editingProfile || {

      'f-p4': '',

      'f-doh': appState.enableDoh ? 'Optional' : '',
    };

    wrap.innerHTML = `

          <div class="form-row-2col">
            <div>
              <div class="field-label-row">

              <input id="f-p4" class="field-input mono" type="text" value="${escHtml(p.primary_v4)}" placeholder="45.90.28.0" />

            <div>
              <div class="field-label-row">
                <label for="f-s4" class="field-label">Secondary IPv4</label>

          </div>

          <div>
            <button type="button" class="adv-toggle-btn" id="btn-adv" aria-expanded="${showAdvanced}">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <line x1="3" y1="7" x2="11" y2="7" />
                <line class="adv-plus-v" x1="7" y1="3" x2="7" y2="11" />
              </svg>
              <span>IPv6 / DoH</span>
            </button>
            <div class="adv-collapse ${showAdvanced ? 'is-open' : ''}" id="adv-collapse" aria-hidden="${!showAdvanced}" ${showAdvanced ? '' : 'inert'}>
              <div class="adv-collapse-inner">

          </div>
        </form>
      </div>
    `;

    const formEl = wrap.querySelector('#dns-form');
    const saveBtn = wrap.querySelector('#btn-save');
    const readVal = (id, fallback) => {
      const el = wrap.querySelector(`#${id}`);
      return el ? el.value.trim() : String(fallback || '').trim();
    };
    const hasFormChanges = () => {
      if (!editingProfile) return true;
      return (
        readVal('f-name', p.name) !== String(editingProfile.name || '').trim() ||
        readVal('f-p4', p.primary_v4) !== String(editingProfile.primary_v4 || '').trim() ||
        readVal('f-s4', p.secondary_v4) !== String(editingProfile.secondary_v4 || '').trim() ||
        readVal('f-p6', p.primary_v6) !== String(editingProfile.primary_v6 || '').trim() ||
        readVal('f-s6', p.secondary_v6) !== String(editingProfile.secondary_v6 || '').trim() ||
        readVal('f-doh', p.doh_template) !== String(editingProfile.doh_template || '').trim()
      );
    };
    const syncSaveDisabled = () => {
      if (saveBtn) saveBtn.disabled = Boolean(editingProfile) && !hasFormChanges();
    };

    const setFieldError = (inputId, msg) => {
      const inp = wrap.querySelector(`#${inputId}`);
      const hint = wrap.querySelector(`#hint-${inputId}`);
      const offBtn = wrap.querySelector(`[data-off-btn="${inputId}"]`);
      if (!inp || !hint) return;
      if (msg) {
        inp.classList.add('is-invalid');
        inp.setAttribute('aria-invalid', 'true');
        inp.setAttribute('aria-describedby', `hint-${inputId}`);
        hint.textContent = msg;
        hint.classList.remove('is-empty');
        hint.classList.add('is-error');
        hint.setAttribute('role', 'alert');
        if (offBtn) offBtn.style.display = 'none';
      } else {
        inp.classList.remove('is-invalid');
        inp.removeAttribute('aria-invalid');
        inp.removeAttribute('aria-describedby');
        const fallback = defaultHints[inputId] || '';
        hint.textContent = fallback;
        hint.classList.remove('is-error');
        hint.classList.toggle('is-empty', !fallback);
        hint.removeAttribute('role');
        if (offBtn) offBtn.style.display = '';
      }
    };

    const bindInputListeners = (rootEl) => {
      rootEl.querySelectorAll('input').forEach((inp) => {
        inp.addEventListener('input', () => {
          setFieldError(inp.id, null);
          syncSaveDisabled();
        });
      });
    };

    const formScrollEl = wrap.querySelector('.form-scroll');
    let cancelFormScrollGlide = null;
    const glideFormScroll = (mode = 'track', durationMs = 340) => {
      if (cancelFormScrollGlide) cancelFormScrollGlide();
      const btn = wrap.querySelector('#btn-adv');
      if (!formScrollEl || !btn) return;
      const getDesired = () => {
        const maxScroll = Math.max(0, formScrollEl.scrollHeight - formScrollEl.clientHeight);
        return Math.min(maxScroll, Math.max(0, btn.offsetTop - 10));
      };
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        formScrollEl.scrollTo({ top: getDesired(), behavior: 'instant' });
        updateScrollFade(formScrollEl);
        return;
      }
      const startScroll = formScrollEl.scrollTop;
      const startTime = performance.now();
      let rafId = 0;
      let active = true;
      const stop = () => {
        if (!active) return;
        active = false;
        cancelAnimationFrame(rafId);
        formScrollEl.removeEventListener('wheel', stop);
        formScrollEl.removeEventListener('pointerdown', stop);
        formScrollEl.removeEventListener('touchstart', stop);
        if (cancelFormScrollGlide === stop) cancelFormScrollGlide = null;
      };
      cancelFormScrollGlide = stop;
      formScrollEl.addEventListener('wheel', stop, { passive: true });
      formScrollEl.addEventListener('pointerdown', stop, { passive: true });
      formScrollEl.addEventListener('touchstart', stop, { passive: true });
      const step = (now) => {
        if (!active || !formScrollEl.isConnected) {
          stop();
          return;
        }
        const t = Math.min(1, (now - startTime) / durationMs);
        const target = getDesired();
        if (mode === 'track') {
          if (target > formScrollEl.scrollTop) {
            formScrollEl.scrollTo({ top: target, behavior: 'instant' });
            updateScrollFade(formScrollEl);
          }
        } else if (target > startScroll) {
          const eased = t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
          formScrollEl.scrollTo({ top: startScroll + (target - startScroll) * eased, behavior: 'instant' });
          updateScrollFade(formScrollEl);
        }
        if (t < 1) {
          rafId = requestAnimationFrame(step);
        } else {
          updateScrollFade(formScrollEl);
          stop();
        }
      };
      rafId = requestAnimationFrame(step);
    };

    const renderIpv6Slot = (focusInput = false) => {
      const slot = wrap.querySelector('#adv-ipv6-slot');
      if (!slot) return;
      const curP6 = wrap.querySelector('#f-p6') ? wrap.querySelector('#f-p6').value : p.primary_v6;
      const curS6 = wrap.querySelector('#f-s6') ? wrap.querySelector('#f-s6').value : p.secondary_v6;
      defaultHints['f-p6'] = appState.enableIpv6 ? 'Optional' : '';
      const showInputs = appState.enableIpv6 || Boolean(curP6 || curS6);
      if (showInputs) {
        slot.innerHTML = `
          <div class="form-row-2col ${focusInput ? 'adv-slot-reveal' : ''}">
            <div>
              <div class="field-label-row">
                <label for="f-p6" class="field-label">Primary IPv6</label>
                <span id="hint-f-p6" class="field-opt ${appState.enableIpv6 ? '' : 'is-empty'}">${defaultHints['f-p6']}</span>
                ${appState.enableIpv6 ? '' : '<button type="button" class="adv-enable-btn compact" data-enable-setting="enableIpv6" data-off-btn="f-p6" aria-label="Enable IPv6 DNS">Enable</button>'}
              </div>
              <input id="f-p6" class="field-input mono" type="text" value="${escHtml(curP6)}" placeholder="2a07:a8c0::" />
            </div>
            <div>
              <div class="field-label-row">
                <label for="f-s6" class="field-label">Secondary IPv6</label>
                <span id="hint-f-s6" class="field-opt">${defaultHints['f-s6']}</span>
              </div>
              <input id="f-s6" class="field-input mono" type="text" value="${escHtml(curS6)}" placeholder="2a07:a8c1::" />
            </div>
          </div>
        `;
        bindInputListeners(slot);
      } else {
        slot.innerHTML = `
          <div class="adv-off-row">
            <span>IPv6 DNS</span>
            <button type="button" class="adv-enable-btn" data-enable-setting="enableIpv6" aria-label="Enable IPv6 DNS">Enable</button>
          </div>

      }
      const enableBtn = slot.querySelector('[data-enable-setting="enableIpv6"]');
      if (enableBtn) {
        enableBtn.onclick = () => {

          playSound('toggleOn');
          postIpc({ type: 'toggleSetting', key: 'enableIpv6', value: true });

        const p6Input = slot.querySelector('#f-p6');

          p6Input.focus({ preventScroll: true });
        }

    };

    const renderDohSlot = (focusInput = false) => {
      const slot = wrap.querySelector('#adv-doh-slot');
      if (!slot) return;
      const curDoh = wrap.querySelector('#f-doh') ? wrap.querySelector('#f-doh').value : p.doh_template;
      defaultHints['f-doh'] = appState.enableDoh ? 'Optional' : '';
      const showInput = appState.enableDoh || Boolean(curDoh);
      if (showInput) {
        slot.innerHTML = `
          <div class="${focusInput ? 'adv-slot-reveal' : ''}">
            <div class="field-label-row">
              <label for="f-doh" class="field-label">DoH template URL</label>
              <span id="hint-f-doh" class="field-opt ${appState.enableDoh ? '' : 'is-empty'}">${defaultHints['f-doh']}</span>
              ${appState.enableDoh ? '' : '<button type="button" class="adv-enable-btn compact" data-enable-setting="enableDoh" data-off-btn="f-doh" aria-label="Enable DNS-over-HTTPS">Enable</button>'}
            </div>
            <input id="f-doh" class="field-input mono" type="text" value="${escHtml(curDoh)}" placeholder="https://dns.nextdns.io/abc123" />
          </div>
        `;
        bindInputListeners(slot);
      } else {
        slot.innerHTML = `
          <div class="adv-off-row">
            <span>DNS-over-HTTPS</span>
            <button type="button" class="adv-enable-btn" data-enable-setting="enableDoh" aria-label="Enable DNS-over-HTTPS">Enable</button>
          </div>
        `;
      }
      const enableBtn = slot.querySelector('[data-enable-setting="enableDoh"]');
      if (enableBtn) {
        enableBtn.onclick = () => {
          appState.enableDoh = true;
          playSound('toggleOn');
          postIpc({ type: 'toggleSetting', key: 'enableDoh', value: true });
          renderDohSlot(true);
        };
      }
      updateScrollFade(formScrollEl);
      if (focusInput) {
        const revealEl = slot.querySelector('.adv-slot-reveal');
        if (revealEl) {
          requestAnimationFrame(() => revealEl.classList.add('is-shown'));
        }
        glideFormScroll('ease', 220);
        const dohInput = slot.querySelector('#f-doh');
        if (dohInput) {
          dohInput.focus({ preventScroll: true });
        }
      }
    };

    const setAdvancedVisible = (visible) => {
      showAdvanced = visible;
      const collapse = wrap.querySelector('#adv-collapse');
      const btn = wrap.querySelector('#btn-adv');
      collapse.classList.toggle('is-open', showAdvanced);
      collapse.setAttribute('aria-hidden', String(!showAdvanced));
      collapse.inert = !showAdvanced;
      btn.setAttribute('aria-expanded', String(showAdvanced));
      if (showAdvanced) {
        glideFormScroll('track', 340);
      } else if (cancelFormScrollGlide) {
        cancelFormScrollGlide();
      }
      updateScrollFade(formScrollEl);
    };

    wrap.querySelector('#adv-collapse').addEventListener('transitionend', (ev) => {
      if (ev.propertyName === 'grid-template-rows') {
        updateScrollFade(formScrollEl);
      }
    });

    bindInputListeners(formEl);
    renderIpv6Slot(false);
    renderDohSlot(false);
    syncSaveDisabled();

    wrap.querySelector('#btn-adv').onclick = () => {
      const next = !showAdvanced;
      playSound(next ? 'toggleOn' : 'toggleOff');
      setAdvancedVisible(next);
    };

    formEl.onsubmit = (ev) => {
      ev.preventDefault();
      if (editingProfile && !hasFormChanges()) return;
      const payload = {
        id: editingProfile ? editingProfile.id : null,
        name: readVal('f-name', p.name),
        category: editingProfile ? (editingProfile.category || 'Custom') : 'Custom',
        primary_v4: readVal('f-p4', p.primary_v4),
        secondary_v4: readVal('f-s4', p.secondary_v4),
        primary_v6: readVal('f-p6', p.primary_v6),
        secondary_v6: readVal('f-s6', p.secondary_v6),
        doh_template: readVal('f-doh', p.doh_template),
      };

      const errors = {
        'f-name': !payload.name ? 'Required' : null,
        'f-p4': !payload.primary_v4 ? 'Required' : (!isValidIpv4(payload.primary_v4) ? 'Invalid' : null),
        'f-s4': payload.secondary_v4 && !isValidIpv4(payload.secondary_v4) ? 'Invalid' : null,
        'f-p6': payload.primary_v6 && !isValidIpv6(payload.primary_v6) ? 'Invalid' : null,
        'f-s6': payload.secondary_v6 && !isValidIpv6(payload.secondary_v6) ? 'Invalid' : null,
        'f-doh': !isValidDohUrl(payload.doh_template) ? 'Use https://' : null,
      };

      const order = ['f-name', 'f-p4', 'f-s4', 'f-p6', 'f-s6', 'f-doh'];
      let firstInvalid = null;
      for (const id of order) {
        setFieldError(id, errors[id]);
        if (!firstInvalid && errors[id]) firstInvalid = id;
      }

      if (firstInvalid) {
        playSound('error');
        if (firstInvalid === 'f-p6' || firstInvalid === 'f-s6' || firstInvalid === 'f-doh') {
          if (!showAdvanced) setAdvancedVisible(true);
        }
        const targetInput = wrap.querySelector(`#${firstInvalid}`);
        if (targetInput) {
          targetInput.focus();
          targetInput.scrollIntoView({ block: 'nearest' });
        }
        return;

      playSound('save');
      postIpc({ type: 'saveProfile', profile: payload });
      transitionView('servers', () => {
        editingProfile = null;
      });
    };

    mountViewPanel(main, wrap, animateView);
    attachScrollFade(wrap.querySelector('.form-scroll'));
    setTimeout(() => {

      if (nameInput) nameInput.focus();

  // Footer adapter switcher (Auto <-> available adapters)
  document.getElementById('btn-adapter').addEventListener('click', () => {
    playSound('click');
    postIpc({ type: 'cycleAdapter' });
  });

  // Titlebar drag
  document.getElementById('drag-spacer').addEventListener('mousedown', (ev) => {
    if (ev.button === 0) {
      postIpc({ type: 'dragWindow' });
    }
  });

  // Disable WebView2 browser context menu outside text inputs
  window.addEventListener('contextmenu', (e) => {
    const tag = e.target && e.target.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault();
    }
  });

  // Cancel inline delete confirmation when clicking anywhere outside its action buttons
  document.addEventListener('pointerdown', (e) => {
    if (confirmingDeleteId === null) return;
    if (e.target && e.target.closest && e.target.closest('.dns-row.confirming-delete .row-actions')) {
      return;
    }
    clearConfirmDelete(true);
  });

  // Keyboard shortcuts (Esc, Ctrl+N, ArrowUp/ArrowDown, Enter)
  window.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    if (e.key === 'Escape') {
      e.preventDefault();
      if (confirmingDeleteId !== null) {
        playSound('click');
        clearConfirmDelete(true);
        return;
      }
      if (viewMode === 'add-dns') {
        playSound('click');
        const target = formReturnView;
        transitionView(target, () => {
          editingProfile = null;
        });
      } else if (viewMode === 'settings') {
        playSound('click');
        transitionView('servers');
      } else {
        focusedNavId = null;
        playSound('click');
        animateHideAndPost();
      }
      return;
    }

    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      playSound('click');
      openAddForm('servers');
      return;
    }

    if (viewMode !== 'servers' || isInput) return;

    const ids = [DHCP_ID, ...appState.profiles.map((p) => p.id)];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const anchor = focusedNavId || appState.activeProfileId || DHCP_ID;
      let idx = ids.indexOf(anchor);
      if (idx === -1) idx = e.key === 'ArrowDown' ? 0 : ids.length - 1;
      else idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + ids.length) % ids.length;
      focusedNavId = ids[idx];
      renderBody(false);
      const row = document.querySelector(`.dns-row[data-nav-id="${CSS.escape(focusedNavId)}"]`);
      if (row) row.scrollIntoView({ block: 'nearest' });
      return;
    }

    if (e.key === 'Enter' && focusedNavId !== null) {
      e.preventDefault();
      const targetId = focusedNavId === DHCP_ID ? null : focusedNavId;
      focusedNavId = null;
      playSound(appState.activeProfileId === targetId ? 'click' : targetId ? 'activate' : 'dhcp');
      applyOptimisticActivation(targetId);
    }
  });

  window.__shiftdnsSync = function (next) {
    if (draggingState) {
      pendingSyncPayload = next;
      return;
    }
    const prevDark = appState.darkMode;
    const prevProfilesJson = JSON.stringify(appState.profiles);
    const prevActiveId = appState.activeProfileId;
    const prevLatency = appState.activeLatency;
    const prevResolveStatus = appState.activeResolveStatus;
    const prevResolvedIp = appState.activeResolvedIp;
    const prevProbing = appState.probingActive;
    const prevPingingAll = appState.pingingAll;
    const prevUpdateStatus = appState.updateState && appState.updateState.status;
    const prevProfileProbesJson = JSON.stringify(appState.profileProbes || {});
    const prevDomain = appState.resolveCheckDomain;
    const becameError = Boolean(next.statusIsError) && !appState.statusIsError;

    if (!('activeLatency' in next)) {
      appState.activeLatency = undefined;
    }
    Object.assign(appState, next);
    const animateTheme = hasReceivedSync && prevDark !== appState.darkMode;
    hasReceivedSync = true;
    if (confirmingDeleteId && !appState.profiles.some((p) => p.id === confirmingDeleteId)) {
      clearConfirmDelete(false);
    }
    const pingAllFinished = prevPingingAll && !appState.pingingAll && manualPingAllInFlight;
    if (pingAllFinished) {
      manualPingAllInFlight = false;
    }
    const updateFound =
      prevUpdateStatus !== 'available' &&
      appState.updateState &&
      appState.updateState.status === 'available';
    if (becameError) {
      playSound('error');
    } else if (pingAllFinished || updateFound) {
      playSound('pingDone');
    }

    if (viewMode === 'servers') {
      const profilesChanged = JSON.stringify(appState.profiles) !== prevProfilesJson;
      const activeChanged = appState.activeProfileId !== prevActiveId;
      const probeChanged =
        appState.activeLatency !== prevLatency ||
        appState.activeResolveStatus !== prevResolveStatus ||
        appState.activeResolvedIp !== prevResolvedIp ||
        appState.probingActive !== prevProbing ||
        appState.pingingAll !== prevPingingAll ||
        JSON.stringify(appState.profileProbes || {}) !== prevProfileProbesJson ||
        appState.resolveCheckDomain !== prevDomain;

      applyTheme(animateTheme);
      if (!document.getElementById('btn-ping-all')) {
        renderHeader();
      } else if (profilesChanged || appState.pingingAll !== prevPingingAll) {
        syncPingAllButton();
      }
      if (profilesChanged || activeChanged || !document.getElementById('dns-list')) {
        renderBody(false);
      } else if (probeChanged && !updateActivePingInPlace()) {
        renderBody(false);
      }
      renderFooter();
    } else {
      applyTheme(animateTheme);
      renderFooter();
      if (viewMode === 'settings') {
        syncSettingsControls(true);
        const domainInput = document.getElementById('settings-resolve-domain');
        if (domainInput && document.activeElement !== domainInput && appState.resolveCheckDomain) {
          domainInput.value = appState.resolveCheckDomain;
        }
        renderUpdateRowState(
          document.getElementById('settings-update-sub'),
          document.getElementById('settings-update-slot')
        );
      }
    }
  };

  renderAll(false);
  postIpc({ type: 'ready' });
})();
</script>
</body>
</html>
